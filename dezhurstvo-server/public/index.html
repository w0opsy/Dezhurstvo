 beatAt+=dt; if(beatAt>=rrSec){ beatAt=0; rrSec=60/Math.max(20,hr)*(v.rh==='afib'?0.65+Math.random()*0.7:1); if(on&&!UI.paused&&!ARREST.includes(v.rh)&&!s.over) Sfx.beat(v.sbp>55?v.spo2:0); }
 if(on&&!UI.paused&&!s.over&&!s.talk&&!s.fmQueue){ const arr=ARREST.includes(v.rh); if(arr||v.spo2<85||v.sbp<75||v.hr<40||v.hr>150) Sfx.alarm('high'); else if(v.spo2<90||v.sbp<90||v.sbp>180||v.hr>130||v.hr<45||v.rr>28||v.rr<8) Sfx.alarm('mid'); }
 if(s.arrest&&s.arrest.cpr&&!UI.paused&&!s.over&&!s.talk&&!s.fmQueue){ UI.metro=(UI.metro||0)+dt; if(UI.metro>=60/110){ UI.metro=0; Sfx.metro(); } }
 const nx=sweep+W/4*dt;
 ex.fillStyle='#050807'; ex.fillRect(sweep,0,Math.min(nx+14,W)-sweep,H); if(nx+14>W) ex.fillRect(0,0,nx+14-W,H);
 const steps=Math.max(1,Math.round(nx-sweep));
 for(let i=1;i<=steps;i++){
  const x=sweep+i*(nx-sweep)/steps, frac=beatAt-(steps-i)*dt/steps; let y1,y2;
  if(rh==='off'){ y1=H*0.3; y2=H*0.8; }
  else { const cpr=s.arrest&&s.arrest.cpr, ct=clock-(steps-i)*dt/steps;
   y1=H*0.33-(ecgSample(frac,rh)+(cpr?0.4*Math.sin(ct*2*Math.PI*1.85):0))*H*0.24;
   const pulse=!ARREST.includes(v.rh)&&v.sbp>55;
   const pp=pulse?Math.max(0,Math.sin(Math.PI*Math.min(1,Math.max(0,(frac-0.25)/0.45))))**1.5:(cpr?Math.max(0,Math.sin(ct*2*Math.PI*1.85))*0.35:0);
   y2=H*0.9-pp*H*0.2*(v.sbp>80||cpr?1:0.5); }
  const xx=x%W, st=(nx-sweep)/steps;
  if(prevY!==null&&xx>2){ ex.strokeStyle='#4ee07a'; ex.lineWidth=2.2; ex.beginPath(); ex.moveTo(xx-st,prevY); ex.lineTo(xx,y1); ex.stroke();
   ex.strokeStyle='#5fd3f0'; ex.lineWidth=1.8; ex.beginPath(); ex.moveTo(xx-st,prevP); ex.lineTo(xx,y2); ex.stroke(); }
  prevY=y1; prevP=y2;
 }
 sweep=nx%W;
 ex.font='20px "JetBrains Mono",monospace'; ex.fillStyle='#87a39b'; ex.fillText('II',8,24); ex.fillStyle='#5fd3f0'; ex.fillText('Pleth',8,H*0.64);
 if(!on){ ex.fillStyle='#87a39b'; ex.fillText(locked(s,'mon')?'Монитор отключён':'Отведения не подключены',W*0.3,H*0.5); }
}

// ── Сцена
const sc=$('scene'), cx=sc.getContext('2d');
function rr(x,y,w,h,r,f){ cx.beginPath(); cx.roundRect(x,y,w,h,r); cx.fillStyle=f; cx.fill(); }
function drawScene(s,now){
 const t=now/1000, k=sc.width/960; cx.setTransform(k,0,0,k,0,0); const W=960,H=420;
 const E=Scene.env(s); Scene.background(cx,E,t,s);
 const ground=E.bed==='ground', bx=ground?110:210, by=ground?300:(s.loc==='pol'?262:280);
 Scene.bed(cx,E,bx,by);
 const arr=inArrest(s), F=Portrait.signs(s);
 const breath=arr?0:Math.sin(t*Math.PI*2*Math.max(0.05,s.v.rr)/60)*4;
 const agit=F.includes('возбуждён'), seize=F.includes('судороги');
 const sit=!arr&&(s.f.sit||agit||(['asthma','ape','tamponade'].includes(s.c.id)&&!s.f.legs));
 const sk=F.includes('цианоз')||arr?'#9fb3c8':F.includes('бледность')?'#e6dccd':'#efc6a6';
 const jit=seize?Math.sin(t*35)*6:agit?Math.sin(t*4)*10:0;
 cx.save(); cx.translate(jit,0);
 if(sit){ rr(bx+130,by-120-breath*0.5,110,160,46,'#3f6d8a'); cx.beginPath(); cx.arc(bx+185,by-156,38,0,7); cx.fillStyle=sk; cx.fill(); rr(bx+230,by+8,190,38,18,'#33465a'); if(s.c.preg){ cx.beginPath(); cx.ellipse(bx+232,by-40,44,52,0,0,7); cx.fillStyle='#3f6d8a'; cx.fill(); } }
 else { rr(bx+90,by-18-breath,230,60,30,'#3f6d8a'); if(s.c.preg){ cx.beginPath(); cx.ellipse(bx+200,by-30-breath,60,42,0,0,7); cx.fillStyle='#3f6d8a'; cx.fill(); }
  rr(bx+310,by-8,200,42,20,'#33465a'); cx.beginPath(); cx.arc(bx+50,by+2,38,0,7); cx.fillStyle=sk; cx.fill(); rr(bx-6,by+22,120,16,8,'#f3f3f0'); }
 const hx=sit?bx+185:bx+50, hy=sit?by-156:by+2;
 if(s.o2&&!s.f.intub){ cx.fillStyle='rgba(180,230,210,.6)'; cx.beginPath(); cx.ellipse(hx,hy+12,20,14,0,0,7); cx.fill(); }
 if(s.f.intub){ cx.strokeStyle='#e8f0ff'; cx.lineWidth=5; cx.beginPath(); cx.moveTo(hx,hy+14); cx.lineTo(hx-60,hy-60); cx.stroke(); }
 if(s.f.tq){ rr(sit?bx+250:bx+380,sit?by-30:by+4,18,30,3,'#c33'); }
 if(s.f.fix){ cx.strokeStyle='#e8a33a'; cx.lineWidth=5; [bx+150,bx+400].forEach(x=>{ cx.beginPath(); cx.moveTo(x,by-30); cx.lineTo(x,by+40); cx.stroke(); }); }
 cx.restore();
 Scene.foreground(cx,E,t,s);
 if(s.iv){ cx.strokeStyle='rgba(220,240,255,.7)'; cx.lineWidth=2; const ax=sit?bx+235:bx+200, ay=sit?by-40:by+8; cx.beginPath(); cx.moveTo(ax,ay); cx.quadraticCurveTo(ax+30,ay-140,ax+20,36); cx.stroke(); rr(ax+5,6,30,46,6,'rgba(220,240,255,.85)'); }
 if(UI.flashT>t){ cx.fillStyle=UI.flashC==='ok'?'rgba(76,195,138,.18)':'rgba(229,83,75,.22)'; cx.fillRect(0,0,W,H); }
 cx.fillStyle='rgba(5,8,7,.62)'; cx.fillRect(0,H-40,W,40); cx.fillStyle='#dbe7e2'; cx.font='600 17px Golos Text,sans-serif';
 cx.fillText(`${s.name}, ${s.age} ${plural(s.age,'год','года','лет')} · ${s.sex==='f'?'жен.':'муж.'}${s.c.preg?' · беременность':''}`,16,H-14);
 if(UI.paused){ cx.fillStyle='rgba(5,8,7,.6)'; cx.fillRect(0,0,W,H); cx.fillStyle='#e8a33a'; cx.font='700 40px Unbounded,sans-serif'; cx.fillText('ПАУЗА',W/2-90,H/2); }
}

 log(t,text,cls){ if(cls!=='muted'){ UI.feed=(UI.feed||[]).concat({t,text,cls}).slice(-3); }
  if(isMobile()&&/res|warn|good|cons/.test(cls)&&t!=='00:00'&&$('game').dataset.mv!=='log'&&!(typeof Coach!=='undefined'&&Coach.on)) toast(text,cls);

 render(){ if(!G.s||$('game').hidden) return; renderVitals(); renderAcls(); if(UI.tab==='ask'&&UI.chatLen!==G.s.chat.length+Math.round(G.s.trust)*1000&&document.activeElement.id!=='q'){ UI.chatLen=G.s.chat.length+Math.round(G.s.trust)*1000; $('pane').dataset.dirty=1; } renderPane(false); },

<script>
// Интерфейс v2, часть 2: окна (диалог, форс-мажор, консультант, оформление, справочник), разбор, прогресс.
function openModal(html,cls,pause){ const tt=$('toast'); if(tt) tt.classList.remove('show'); const m=$('modal'); m.className='modal '+(cls||''); m.innerHTML=html; $('overlay').hidden=false; if(pause!==false&&G.s) G.s.modal=true; const f=m.querySelector('button,input,select'); f&&f.focus(); }

document.addEventListener('click',e=>{

 UI.glossSeen=true; const g=GLOSS[+b.dataset.g]; const back=$('overlay').hidden?null:$('modal').innerHTML, backCls=$('modal').className;
 openModal(`<div class="kind">Справочник</div><h2>${esc(g[1])}</h2><p><b>Что это.</b> ${esc(g[2])}</p><p><b>Почему так.</b> ${esc(g[3])}</p><div class="row"><button class="btn pri" id="g-close">Понятно</button></div>`);

G.ui.talk=function(s){

  <div class="agit">Возбуждение <span class="bar"><i style="width:${ag}%"></i></span><span class="mono">${ag}</span></div>
  <div class="say"><b>${esc(T.who)}:</b> ${esc(gendered(node.p,s.sex))}</div>`;
 if(node.end){
  const lbl={agree:'Согласие получено.',calm:'Пациент успокоился и принимает помощь.',refuse:'Пациент отказывается. Оформите письменный отказ.',attack:'Конфликт перешёл в агрессию. Охрана/полиция вмешались.',flee:'Пациент уходит.',restrain:'Пациент фиксирован. Оформите протокол мер стеснения.'}[node.end];

 let body='', canNext=false;

   openModal(`<div class="kind">Обратная связь</div><h2>Скопируйте отчёт</h2><p class="muted" style="margin:0">В этой версии нет сервера — отправьте текст автору игры в Telegram.</p><textarea id="bg-copy" rows="8" readonly>${esc(t)}</textarea><div class="row"><button class="btn pri" id="bg-cp">Скопировать</button><button class="btn" id="bg-ok">Закрыть</button></div><div class="err" id="bg-e2"></div>`,'sheet');
   $('bg-cp').onclick=async()=>{ try{ await navigator.clipboard.writeText(t); $('bg-e2').textContent='Скопировано.'; }catch(e){ $('bg-copy').select(); $('bg-e2').textContent='Выделите текст и скопируйте вручную.'; } };
   $('bg-ok').onclick=closeModal; return; }
  $('bg-send').disabled=false; $('bg-err').textContent='Не отправилось: '+(r.error||'ошибка');
 };
}
