<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c1513"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Дежурство"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="icon.svg">
<style>[hidden]{display:none!important}body{margin:0}img{max-width:100%}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
</head><body>
<title>Дежурство</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=Unbounded:wght@500;700&family=JetBrains+Mono:wght@400;700&display=swap">
<style>
/* Layout: вход → меню (смена/прогресс/справочник) → рабочее место (сцена, портрет+монитор | вкладки) → разбор. Тёмная «ночная смена», одна тема. */
:root{
  --bg:#0c1513; --panel:#13201d; --panel2:#182a26; --line:#25403a; --fg:#dbe7e2; --muted:#87a39b;
  --accent:#e8a33a; --danger:#e5534b; --ok:#4cc38a; --info:#5bc0de; --cons:#b9a6ff;
  --hr:#4ee07a; --spo2:#5fd3f0; --bp:#ff6b6b; --rr:#f2d24b; --temp:#c9a0ff;
  --f-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;font-weight:600}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.wrap{max-width:1320px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
select,input[type=text],input[type=password],textarea{background:var(--panel2);border:1px solid var(--line);color:var(--fg);border-radius:6px;padding:7px 9px;font:inherit}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:6px 11px}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);color:#1b1206;border-color:var(--accent);font-weight:600}
.btn.dng{border-color:var(--danger);color:#ffb3ae}
.btn.cons{border-color:#5d4f99;color:#ddd3ff}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grp{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:12px 0 6px}
.grp:first-child{margin-top:0}
.err{color:#ffb3ae;min-height:1.4em}

/* Вход и меню */
.brand{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.brand h1{font-size:clamp(28px,5vw,44px);letter-spacing:-.01em}
.brand h1 span{color:var(--accent)}
.brand p{margin:0;color:var(--muted);max-width:62ch}
#auth,#menu{display:flex;flex-direction:column;gap:18px;padding-block:20px}
.authbox{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;max-width:820px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:10px}
.who-bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;color:var(--muted);font-size:13px}
.who-bar b{color:var(--fg)}
.mtabs{display:flex;gap:4px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.mtabs button{background:none;border:0;border-bottom:2px solid transparent;padding:10px 14px;color:var(--muted)}
.mtabs button[aria-selected=true]{color:var(--fg);border-bottom-color:var(--accent)}
.tghero{display:flex;flex-direction:column;gap:12px;background:linear-gradient(160deg,#12302a,#0f1d1a 60%);border:1px solid var(--line);border-radius:14px;padding:16px}
.tgme{display:flex;align-items:center;gap:12px}
.ava{position:relative;flex:none;width:52px;height:52px;border-radius:50%;background:#1d4a40;color:#bdf0d4;display:grid;place-items:center;overflow:hidden;font-weight:700;font-size:18px}
.ava img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.ava i{font-style:normal}
.ava.sm{width:30px;height:30px;font-size:11px}
.tgme .who{display:flex;flex-direction:column;min-width:0;flex:1}.tgme .who small{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.tgme .who b{font-size:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tgme .who span{font-size:12px}
.tgme .pts{display:flex;flex-direction:column;align-items:flex-end}.tgme .pts b{font-family:var(--f-mono);font-size:26px;color:var(--accent);line-height:1}.tgme .pts small{color:var(--muted);font-size:11px}
.tgstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.tgstats span{background:#0c1513;border:1px solid var(--line);border-radius:10px;padding:8px;display:flex;flex-direction:column;font-size:11px;color:var(--muted)}
.tgstats b{font-family:var(--f-mono);font-size:17px;color:var(--fg)}
.tgcta{display:grid;grid-template-columns:2fr 1fr;gap:8px}.btn.big{padding:14px;font-size:16px;font-weight:700}
.tgtop{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.tth{display:flex;justify-content:space-between;align-items:center}.lnk{background:none;border:0;color:var(--accent);font-size:13px;padding:0;cursor:pointer}
.trow{display:flex;align-items:center;gap:10px;padding:6px 4px;border-radius:8px}.trow.me{background:#163a32}
.trow .pl{width:24px;text-align:center;font-family:var(--f-mono)}.trow .nm{flex:1;min-width:0;display:flex;flex-direction:column;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trow .nm small{color:var(--muted);font-size:11px}.trow b{font-family:var(--f-mono);color:var(--accent)}.tgap{text-align:center;color:var(--muted);line-height:.6}
.rkname{display:flex;align-items:center;gap:8px}.rkname>span{display:flex;flex-direction:column}.rkname small{font-size:11px}
.cat-head{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap;margin-bottom:8px}.cat-head b{font-family:var(--f-mono);font-size:22px;color:var(--accent)}.cat-head .muted{font-size:12px;flex:1;min-width:200px}
.disc{margin-bottom:4px}.clist{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:8px;margin:6px 0 10px}
.ccard{display:flex;flex-direction:column;gap:3px;text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:72px}
.ccard:hover{border-color:var(--accent)}.ccard .ct{font-weight:600;font-size:15px}.ccard .cdx{font-size:12.5px;color:#bdf0d4}.ccard .cdx.muted{color:var(--muted)}
.ccard .cmeta{display:flex;gap:8px;align-items:center;font-size:11.5px;flex-wrap:wrap}
.stars{letter-spacing:1px;font-size:15px;line-height:1}.stars i{font-style:normal;color:#3a4f49}.stars i.on{color:#f2c14e;text-shadow:0 0 6px rgba(242,193,78,.35)}.stars.none i{color:#2a3a36}
.dstars{font-size:28px;margin:4px 0}
.coach-ok,.coach-fix{border-radius:12px;padding:12px 14px;border:1px solid}.coach-ok{background:#10241f;border-color:#2d5a4c}.coach-ok b{color:#bdf0d4;font-size:16px}.coach-ok p{margin:6px 0 0}
.coach-fix{background:#1d1a10;border-color:#5a4317}.coach-fix>b{color:#ffcf8a;font-size:16px}.coach-fix p{margin:6px 0 0}.coach-fix .h{font-weight:600;margin-top:10px}.coach-fix ul{margin:4px 0 0;padding-left:20px}.coach-fix li{margin:2px 0}
.guides{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}.gcard{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--panel)}
.gcard .gh{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px}.gcard.ru .gh{color:#7fb8ff}.gcard.intl .gh{color:#c9a0ff}
.gcard ul{margin:0;padding-left:18px}.gcard li{margin:4px 0;font-size:13.5px}.gcmp{margin-top:8px;font-size:13.5px;background:var(--panel2);border-radius:10px;padding:8px 12px}
.locs{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.loc{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;text-align:left;display:flex;flex-direction:column;gap:8px;transition:border-color .15s,transform .15s}
.loc:hover{border-color:var(--accent);transform:translateY(-2px)}
.loc .tag{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.loc h3{font-size:17px}
.loc p{margin:0;color:var(--muted);font-size:13px}
.setrow{display:flex;gap:16px;flex-wrap:wrap;align-items:center;color:var(--muted);font-size:13px}
.setrow label{display:flex;gap:6px;align-items:center}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th,.tbl td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl th{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:400}
.tblwrap{overflow-x:auto}
.bar{height:6px;background:var(--panel2);border-radius:3px;overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;background:var(--accent)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px}
.kpi b{font-family:var(--f-display);font-size:26px;display:block}
.gl{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.gl .card h3{font-size:15px}
.gl p{margin:0;font-size:13px}

/* Игра */
#game{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:12px}
@media (max-width:960px){#game{grid-template-columns:1fr}}
.topbar{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.topbar .where{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.topbar .who{font-weight:600}
.topbar .sp{flex:1}
#b-more{display:none}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chips .chip{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-size:13px;color:var(--fg)}.chips .chip.on{border-color:var(--accent);color:var(--accent)}
#modal textarea{width:100%;box-sizing:border-box;background:#0c1513;color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:10px;font:inherit;font-size:15px;resize:vertical}
.netnote{font-size:12px;color:#ffcf8a;background:#2a210f;border:1px solid #5a4317;border-radius:8px;padding:6px 8px;margin:4px 0}.topbar .sn{display:none}
.splash{min-height:70vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px}
.spin{width:34px;height:34px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.tglogin{border-color:#2a6f9e;background:linear-gradient(160deg,#10263a,var(--panel));margin-bottom:12px}.tglogin #tgw{min-height:44px}
.tgfail{border-color:#7a2b26;margin-bottom:12px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:#0c1513;border:1px solid var(--line);border-radius:10px;padding:3px;margin-bottom:10px}
.seg button{background:none;border:0;border-radius:7px;padding:9px 6px;color:var(--muted);font-weight:600;font-size:14px}
.seg button[aria-selected=true]{background:var(--panel2);color:var(--fg);box-shadow:inset 0 0 0 1px var(--line)}
.grid-btn button.done{border-color:#2d5a4c}.grid-btn button.done .sub{color:var(--ok)}
.grid-btn button.wait{border-color:#6b5420}.grid-btn button.wait .sub{color:var(--accent);font-family:var(--f-mono)}
.qbtn button.used{opacity:.55}
.acc{display:flex;justify-content:space-between;align-items:center;width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:12px;margin:6px 0;font-weight:600;font-size:14px;text-align:left}
.acc small{color:var(--muted);font-family:var(--f-mono)}.acc::after{content:'▾';margin-left:8px;color:var(--muted);transition:transform .15s}.acc.open::after{transform:rotate(180deg)}
.acc+.grid-btn{margin-bottom:6px}
.toast{position:fixed;left:8px;right:8px;bottom:calc(66px + env(safe-area-inset-bottom,0px));z-index:60;background:#0f2a24;border:1px solid #2d5a4c;color:#dbe7e2;border-radius:12px;padding:10px 12px;font-size:14px;line-height:1.35;text-align:left;
 box-shadow:0 8px 24px rgba(0,0,0,.45);transform:translateY(140%);opacity:0;transition:transform .2s,opacity .2s;max-height:40vh;overflow:hidden;pointer-events:none}
.toast.show{transform:none;opacity:1;pointer-events:none}.toast.warn{background:#2f1513;border-color:#7a2b26}.toast.cons{background:#1d1833;border-color:#4b3f80}.toast.good{background:#123024}
.sheet .opts{display:flex;flex-direction:column;gap:8px}.sheet .opts button{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px;text-align:left;font-size:15px;min-height:52px}
.sheet .opts button.dng b{color:var(--danger)}
.clock{font-family:var(--f-mono);font-size:18px}
.left{display:flex;flex-direction:column;gap:12px;min-width:0}
#scene{width:100%;aspect-ratio:16/7;max-width:100%;display:block;border-radius:10px;border:1px solid var(--line);background:#0a100f}
.vis{display:grid;grid-template-columns:minmax(0,220px) minmax(0,1fr);gap:12px}
@media (max-width:560px){.vis{grid-template-columns:1fr}}
.face{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:6px}
#portrait{width:100%;aspect-ratio:1;max-width:min(100%,260px);margin:0 auto;display:block;border-radius:8px}
.signs{display:flex;flex-wrap:wrap;gap:4px}
.sign{font-size:11px;border:1px solid var(--line);border-radius:999px;padding:1px 7px;color:var(--muted)}
.monitor{background:#050807;border:1px solid #1d2b28;border-radius:10px;padding:10px;display:grid;grid-template-columns:minmax(0,1fr) 140px;gap:8px;align-items:stretch}
@media (max-width:560px){.monitor{grid-template-columns:1fr}}
#ecg{width:100%;height:100%;min-height:150px;display:block}
.vitals{display:grid;grid-template-columns:1fr 1fr;gap:4px 8px;font-family:var(--f-mono)}
.vt{display:flex;flex-direction:column;line-height:1.05}
.vt small{font-size:10px;letter-spacing:.06em;opacity:.75}
.vt b{font-size:22px;font-weight:700}
.vt.wide{grid-column:1/-1}
.vt.alarm b{animation:blink .8s steps(2) infinite}
@keyframes blink{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.vt.alarm b{animation:none;text-decoration:underline}}
.c-hr{color:var(--hr)}.c-spo2{color:var(--spo2)}.c-bp{color:var(--bp)}.c-rr{color:var(--rr)}.c-t{color:var(--temp)}
.monitor .unknown b{color:#3b4a46}
.lines{font-size:12px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);border-radius:999px;padding:2px 8px;font-size:12px;background:var(--panel)}
.chip.on{border-color:var(--ok);color:#bdf0d4}
.chip.lock{border-color:var(--danger);color:#ffb3ae}
.code{display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:#2a1312;border:1px solid var(--danger);border-radius:10px;padding:8px 10px;font-size:13px}
.code b{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.code .chip{background:#1d0d0c}
.code .chip.due{border-color:var(--accent);color:#ffe0a8;animation:blink 1s steps(2) infinite}
.code .chip.bad{border-color:var(--danger);color:#ffb3ae;animation:blink .8s steps(2) infinite}
@media (prefers-reduced-motion:reduce){.code .chip.due,.code .chip.bad{animation:none}}
.mini .codeline{grid-column:1/-1;font-size:11.5px;color:#ffb3ae;font-family:var(--f-mono)}
.right{background:var(--panel);border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;min-width:0;min-height:540px}
.tabs{display:flex;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:10px 12px;color:var(--muted)}
.tabs button[aria-selected=true]{color:var(--fg);border-bottom-color:var(--accent)}
.pane{padding:12px;overflow:auto;flex:1;max-height:68vh}
.grid-btn{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.grid-btn button{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:7px 9px;text-align:left;font-size:13px}
.grid-btn button:hover{border-color:var(--accent)}
.grid-btn button .sub{display:block;font-size:11px;color:var(--muted)}
.search{width:100%;margin-bottom:8px}
.dose{display:flex;flex-direction:column;gap:6px;background:var(--panel2);border:1px solid var(--accent);border-radius:8px;padding:10px;margin-bottom:10px}
.chat{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.msg{max-width:85%;padding:8px 10px;border-radius:10px;font-size:13.5px}
.msg.doc{align-self:flex-end;background:#2a2213;border:1px solid #4a3a1c}
.msg.pt{align-self:flex-start;background:var(--panel2);border:1px solid var(--line)}
.msg.pt i{display:block;font-size:11px;color:var(--muted);font-style:normal}
.ask{display:flex;gap:6px}
.ask input{flex:1;min-width:0}
.trust{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);margin-bottom:8px}
.trust .bar{flex:1;max-width:200px}
.trust .bar i{background:var(--ok)}
.pend{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;font-size:13px;color:#cfe9ff}.pend i{font-style:normal;color:var(--muted)}.pend b{font-family:var(--f-mono);color:var(--accent);font-weight:600}
.pendbar{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px}.pend .btn.sm{padding:3px 10px;font-size:12px;margin-left:auto}
.mini .pend.m{grid-column:1/-1;font-size:11.5px;gap:4px 8px;flex-wrap:nowrap;white-space:nowrap;overflow:hidden;height:26px;min-width:0}.mini .pend.m>span{flex:none}.mini .pend.m .btn.sm{flex:none}.mini .pend.m .btn.sm{padding:2px 8px;font-size:11px}
.log{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;max-height:200px;overflow:auto;font-size:13px}
.log div{padding:2px 0;border-bottom:1px dashed #1e332e}
.log time{font-family:var(--f-mono);color:var(--muted);margin-right:8px;font-size:12px}
.log .res{color:#cfe9ff}.log .warn{color:#ffb3ae}.log .good{color:#bdf0d4}.log .act{color:var(--accent)}.log .cons{color:#ddd3ff}
.term{background:none;border:0;border-bottom:1px dotted currentColor;padding:0;color:inherit;cursor:help}
.term:hover{color:var(--accent)}

/* Модальные окна */
.overlay{position:fixed;inset:0;background:rgba(3,6,5,.72);display:flex;align-items:center;justify-content:center;z-index:50;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:12px;max-width:680px;width:100%;max-height:100%;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:12px}
.modal h2{font-size:18px}
.modal .kind{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.modal.fm{border-color:var(--danger)} .modal.fm .kind{color:var(--danger)}

<script>
// Звуки: синтез через WebAudio, без файлов. Интерфейс и монитор включаются отдельно.
const Sfx=(()=>{
 let ac=null, master=null;
 const P=(()=>{ try{ return {ui:true,mon:true,vol:0.5,...JSON.parse(localStorage.getItem('dj-sound')||'{}')}; }catch(e){ return {ui:true,mon:true,vol:0.5}; } })();
 const save=()=>{ try{ localStorage.setItem('dj-sound',JSON.stringify(P)); }catch(e){} };
 function ctx(){
  if(!ac){ try{ ac=new (window.AudioContext||window.webkitAudioContext)(); master=ac.createGain(); master.gain.value=P.vol; master.connect(ac.destination); }catch(e){ return null; } }
  if(ac.state==='suspended') ac.resume().catch(()=>{});
  return ac;
 }
 function tone(f,dur,{type='sine',vol=0.25,at=0,slide=0,attack=0.005}={}){
  const a=ctx(); if(!a) return; const t=a.currentTime+at;
  const o=a.createOscillator(), g=a.createGain(); o.type=type; o.frequency.setValueAtTime(f,t); if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(40,f+slide),t+dur);
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+attack); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t+dur+0.02);
 }
 function noise(dur,vol){
  const a=ctx(); if(!a) return; const b=a.createBuffer(1,a.sampleRate*dur,a.sampleRate), d=b.getChannelData(0);
  for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,3);
  const s=a.createBufferSource(), g=a.createGain(), f=a.createBiquadFilter(); f.type='highpass'; f.frequency.value=2500; g.gain.value=vol;
  s.buffer=b; s.connect(f); f.connect(g); g.connect(master); s.start();
 }
 let lastAlarm=0;
 const api={
  get prefs(){ return P; },
  set(k,v){ P[k]=v; save(); if(k==='vol'&&master) master.gain.value=v; },
  unlock(){ ctx(); },
  click(){ if(P.ui){ noise(0.03,0.35); tone(1800,0.03,{type:'square',vol:0.04}); } },
  tab(){ if(P.ui) tone(900,0.05,{type:'triangle',vol:0.12}); },
  give(){ if(P.ui){ tone(520,0.08,{type:'triangle',vol:0.15}); tone(780,0.1,{type:'triangle',vol:0.12,at:0.06}); } },
  result(){ if(P.ui){ tone(1320,0.06,{vol:0.1}); tone(1760,0.08,{vol:0.08,at:0.07}); } },
  msg(){ if(P.ui) tone(660,0.09,{type:'sine',vol:0.12,slide:180}); },
  talk(){ if(P.ui){ tone(392,0.12,{type:'triangle',vol:0.12}); tone(494,0.14,{type:'triangle',vol:0.1,at:0.1}); } },
  alert(){ if(P.ui){ [0,0.18,0.36].forEach(at=>tone(880,0.12,{type:'square',vol:0.09,at})); } },
  tickTimer(){ if(P.ui) tone(1200,0.03,{type:'square',vol:0.05}); },
  good(){ if(P.ui){ tone(523,0.12,{vol:0.15}); tone(659,0.12,{vol:0.15,at:0.1}); tone(784,0.22,{vol:0.15,at:0.2}); } },
  bad(){ if(P.ui){ tone(330,0.25,{type:'sawtooth',vol:0.08,slide:-120}); } },
  end(ok){ if(!P.ui) return; if(ok){ [523,659,784,1046].forEach((f,i)=>tone(f,0.18,{vol:0.13,at:i*0.11})); } else { [392,330,262].forEach((f,i)=>tone(f,0.3,{type:'triangle',vol:0.12,at:i*0.2})); } },
  // Монитор: тон пульса зависит от сатурации, как у настоящих мониторов.
  metro(){ if(P.mon) tone(1500,0.025,{type:'square',vol:0.05}); },
  beat(spo2){ if(P.mon){ const f=spo2>0?380+Math.max(0,spo2-70)*14:420; tone(f,0.07,{type:'sine',vol:0.12}); } },
  alarm(level){ if(!P.mon) return; const now=performance.now(); const gap=level==='high'?1200:3000; if(now-lastAlarm<gap) return; lastAlarm=now;
   if(level==='high'){ [0,0.15,0.3,0.6,0.75].forEach(at=>tone(960,0.1,{type:'square',vol:0.07,at})); }
   else { tone(660,0.15,{type:'triangle',vol:0.08}); tone(520,0.2,{type:'triangle',vol:0.08,at:0.18}); } },
 };
 document.addEventListener('pointerdown',()=>ctx(),{once:true});
 document.addEventListener('keydown',()=>ctx(),{once:true});
 document.addEventListener('click',e=>{ const b=e.target.closest('button,input[type=checkbox],input[type=radio],label'); if(b&&!b.disabled&&!b.dataset.silent) api.click(); },true);
 return api;
})();

</script>
<script>

function doseLabel(dose,s){
 if(!dose.kd||!s) return dose.t;
 const v=Math.min(dose.kd.mg*s.wt,dose.kd.max); const r=v<1?v.toFixed(2):v<10?v.toFixed(1):Math.round(v);
 return dose.t+' → '+String(r).replace('.',',')+' '+dose.kd.u;
}

function gendered(txt,sex){
 if(!txt) return txt;
 return String(txt).replace(/\{([^|{}]+)\|([^|{}]+)\}/g,(m,a,b)=>sex==='f'?b:a)
  .replace(/([А-Яа-яЁё]+)\((а|ась|ка|ая|шла|ла)\)/g,(m,w,suf)=>{
   if(sex!=='f') return w;
   if(suf==='ая') return w.replace(/(ой|ый|ий)$/,'')+'ая';
   if(suf==='шла'||suf==='ла') return w.replace(/(ёл|ел|ол)$/,'')+suf;
   if(suf==='ась'&&/ся$/.test(w)) return w.slice(0,-2)+'ась';
   return w+suf; })
  .replace(/\(дошла\)/g,'');
}

function drugReply(id,fx){
 if(DRUG_NOTE[id]) return DRUG_NOTE[id];
 const d=DRUGS.find(x=>x.id===id), parts=[], f=fx||{};
 if(f.sbp<=-5) parts.push('АД снижается'); else if(f.sbp>=5) parts.push('АД повышается');
 if(f.hr<=-5) parts.push('пульс урежается'); else if(f.hr>=5) parts.push('пульс учащается');
 if(f.rr<=-3) parts.push('дыхание становится реже'); if(f.spo2>=2) parts.push('сатурация растёт');
 if(f.glu>=2) parts.push('глюкоза растёт'); else if(f.glu<=-2) parts.push('глюкоза снижается');
 if(f.gcs<=-2) parts.push('седация'); else if(f.gcs>=2) parts.push('сознание проясняется');
 if(f.t<=-0.2) parts.push('температура снижается'); else if(f.t>=0.2) parts.push('согревается');
 return (d?d.n.split(' (')[0]:'Препарат')+': '+(parts.length?parts.join(', ')+'.':'введено, заметного влияния на показатели нет.');
}
function act(key){
 const s=G.s; if(!s||s.over) return;
 if(G.paused){ log('Игра на паузе — нажмите «Продолжить», чтобы действовать.','muted'); return; }
 const [type,rest]=key.split(':'); const [id,di]=rest.split('#');
 let label='', generic={};
 if(type==='d'){
  const d=DRUGS.find(x=>x.id===id), dose=d.d[+di||0];
  if(locked(s,'drug:'+id)){ log(d.n+' — нет в наличии.','warn'); return; }
  if(needsIV(dose.t)&&!s.iv){ log('Нет венозного доступа — '+d.n+' в/в ввести нельзя.'+(inArrest(s)?' При остановке быстрее всего — внутрикостный доступ (Манипуляции).':''),'warn'); return; }
  label=d.n+' — '+dose.t; generic=dose.fx||{};
  if(s.c.child&&!dose.kid&&d.d.some(x=>x.kid)&&!(s.c.tx[key]&&s.c.tx[key].fx)){ s.badHits.push({t:'Взрослая доза ребёнку: '+d.n+'.',w:15}); generic=Object.fromEntries(Object.entries(generic).map(([k,v])=>[k,v*2])); if(generic.rr===undefined&&/седац|Анальгезия/.test(d.g)) generic.rr=-8; }
  if(!s.c.child&&dose.kid) s.badHits.push({t:'Детская доза взрослому: '+d.n+' — недостаточно.',w:5});
  if(dose.kd) label=d.n+' — '+doseLabel(dose,s);
 } else if(type==='p'){
  const p=PROCS.find(x=>x.id===id); label=p.n;
  if(id==='iv'&&locked(s,'iv')){ log('Все медсёстры заняты, катетер придётся ставить самому — займёт время.','warn'); s.pend.push({at:s.t+3,wait:'Катетер',text:'Катетер установлен.',cls:'res',set:'iv'}); record(s,key); return; }
  if((id==='o2'||id==='o2n')&&locked(s,'o2')){ log('Кислорода нет — баллон пуст.','warn'); return; }
  if(!procPre(s,id)) return;
 }
 record(s,key);
 log(label,'act');
 if(type==='d'&&inArrest(s)) arrestDrug(s,id,+di||0);
 if(type==='d') checkInteractions(s,id);
 let tx=(s.c.tx[key])||(s.c.tx[type+':'+id]);
 // Эффект с шансом (вагусная проба и т.п.): не сработало — ответ tx.fail
 if(tx&&tx.chance!==undefined&&Math.random()>tx.chance) tx=tx.fail||{msg:'Без эффекта.'};
 const fx=(tx&&tx.fx)?(type==='d'?{...generic,...tx.fx}:tx.fx):generic; // препарат: общая фармакология + особенности кейса
 if(!inArrest(s)){ if(type==='d') giveDrug(s,id,fx,!!(tx&&tx.fx)); else applyFx(s,fx); }
 if(tx&&tx.set&&!inArrest(s)) Object.assign(s.v,tx.set);
 if(tx){ if(tx.flag) s.f[tx.flag]=true; if(tx.dr){ markTxDrift(s,tx.dr); Object.assign(s.dr,tx.dr); } if(tx.msg&&!inArrest(s)) s.pend.push({at:s.t+0.25,text:tx.msg,cls:'res'}); }
 else if(type==='d'&&!inArrest(s)){ const pk=(typeof PK!=='undefined'&&PK[id])||{on:3}; s.pend.push({at:s.t+Math.min(2,Math.max(0.25,pk.on*0.5)),text:drugReply(id,generic),cls:'res'}); }
 if(type==='p') procPost(s,id,!!tx);

}
function record(s,key){
 const [type,rest]=key.split(':'), base=type+':'+rest.split('#')[0];
 [...new Set([key,base])].forEach(k=>{ if(s.done[k]===undefined) s.done[k]=s.t; s.cnt[k]=(s.cnt[k]||0)+1; });
 s.acts.push({t:s.t,key});
 // Вентиляция мешком/через трубку/воздуховод идёт с O₂ 15 л/мин — это и есть кислородотерапия (если баллон не пуст)
 if(['p:bvm','p:eti','p:sga'].includes(base)&&!locked(s,'o2')){ s.o2=true; if(s.done['p:o2']===undefined) s.done['p:o2']=s.t; }
}
// Лечебный тренд (из ответа на лечение) останавливается, когда показатель дошёл до нормы, — организм не «перелечивается» бесконечно.
const NORM_MID={hr:80,sbp:120,dbp:75,spo2:97,rr:16,glu:6,t:36.8,gcs:15}, NORM_HI={hr:90,sbp:130,dbp:85,spo2:98,rr:18,glu:7.5,t:37,gcs:15}, NORM_LO={hr:70,sbp:115,dbp:70,spo2:0,rr:14,glu:5,t:36.6,gcs:3};
function markTxDrift(s,dr){ s.drTx=s.drTx||{}; for(const k in dr){ if(NORM_MID[k]===undefined){ continue; } const v=s.v[k]; s.drTx[k]=(dr[k]>0&&v<NORM_MID[k])||(dr[k]<0&&v>NORM_MID[k]); } }
function txDriftDone(s,k){ if(!s.drTx||!s.drTx[k]) return false; const d=s.dr[k], v=s.v[k]; return (d>0&&v>=NORM_HI[k])||(d<0&&v<=NORM_LO[k]); }
function applyFx(s,fx){ for(const k in fx){ if(k==='rh') continue; s.v[k]=(s.v[k]||0)+fx[k]; if(k==='sbp'&&fx.dbp===undefined) s.v.dbp+=fx[k]*0.6; } normalize(s); }
function normalize(s){
 const v=s.v; if(inArrest(s)) return;
 v.hr=clamp(v.hr,20,220); v.sbp=clamp(v.sbp,30,260); v.dbp=clamp(Math.min(v.dbp,v.sbp-12),0,160);
 v.spo2=clamp(v.spo2,40,100); v.rr=clamp(v.rr,0,50); v.gcs=clamp(v.gcs,3,15); v.glu=clamp(v.glu,0.8,45); v.t=clamp(v.t,20,43);
 if(['sinus','stach','sbrady','stemi'].includes(v.rh)&&typeof maxHR==='function') v.hr=Math.min(v.hr,maxHR(s));
}

function procPre(s,id){
 if(id==='cpr'&&!inArrest(s)){ log('Пульс есть — компрессии не показаны. Пациент кричит от боли.','warn'); s.badHits.push({t:'СЛР при сохранённом кровообращении.',w:15}); return false; }

 const v=s.v, arr=inArrest(s), sedated=s.acts.some(a=>a.t>s.t-10&&/^d:(pro|ktm|mdz|dzp|fen|roc|sux)/.test(a.key));

 if((id==='o2'||id==='o2n')&&s.o2&&s.o2type===id){ log('Кислород уже подаётся этим способом.','muted'); return false; }
 if(id==='eti'&&!arr&&v.gcs>8&&!sedated){ log('Пациент в сознании и сопротивляется — интубация без индукции (седация ± миорелаксант) невозможна.','warn'); return false; }
 if(id==='cvs'&&!arr&&v.gcs>12&&!sedated&&!(s.c.bad||[]).some(b=>b.k.includes('p:cvs'))){ s.badHits.push({t:'Кардиоверсия у пациента в сознании без седации.',w:10}); log('Разряд у пациента в сознании без седации — сильная боль, психологическая травма.','warn'); }
 if(id==='cpap'&&!arr&&v.gcs<9){ log('НИВЛ противопоказана при угнетении сознания (GCS <9) — нет защиты дыхательных путей, риск аспирации.','warn'); s.badHits.push({t:'НИВЛ при угнетённом сознании.',w:5}); return false; }
 if(id==='bvm'&&!arr&&v.gcs>=13&&v.rr>=10&&v.spo2>=90){ log('Пациент в сознании и дышит сам — маску отталкивает, вспомогательная вентиляция не нужна.','muted'); return false; }
 return true;

 switch(id){

  case 'surg': s.pend.push({at:s.t+15,wait:'Хирург',text:'Консультант на месте.',cls:'res'}); if(s.c.ex.egd){ s.pend.push({at:s.t+35,wait:'ЭГДС',text:'Результат: '+exText(s,'egd'),cls:'res',flag:'endoDone'}); if(s.done['x:egd']===undefined) s.done['x:egd']=s.t+35; } break;

function checkBad(s,key){
 const [type,rest]=key.split(':'); const base=type+':'+rest.split('#')[0];
 for(const b of s.c.bad){ if(!b.w) continue;
  const ks=b.k.split('|'); if(!ks.some(k=>k===key||k===base)) continue;
  if(b.c&&!b.c(s)) continue; if(s.badHits.some(h=>h.t===b.t)) continue;
  s.badHits.push({t:b.t,w:b.w,at:s.t});
 }
}

function tick(dt){
 const s=G.s; if(!s||s.over) return;
 if(s.talk||s.fmQueue||s.modal) return; // время стоит, пока открыт диалог/форс-мажор

 if(!inArrest(s)){

  if(v.spo2<80) v.gcs-=0.3*dt; if(v.sbp<65) v.gcs-=0.25*dt; if(v.glu<2.5) v.gcs-=0.2*dt;

  const W=s.c.wake, sed=(s.fxSum&&(s.fxSum.gcs||0)<-1), wk=W&&W.rate&&(!W.if||W.if.split('|').some(f=>s.f[f]));

  const gcap=v.t<34?15-(34-v.t)*1.4:15;
  if(v.gcs>gcap+0.5) v.gcs-=0.3*dt;
  if(v.spo2>90&&v.sbp>85&&v.glu>3.5&&!(s.dr.gcs<0)&&v.gcs<Math.min(15,gcap)&&!s.f.det&&!s.f.stroke) v.gcs+=(wk&&!sed?W.rate:0.05)*dt;
  physiology(s,dt);
  normalize(s);
  s.low.sbp=v.sbp<=45?s.low.sbp+dt:0; s.low.spo2=v.spo2<62?s.low.spo2+dt:0;
  const fs=s.fxSum||{};
  if(s.low.sbp>Math.min(1.5,s.D.death)||v.sbp<=31){ startArrest(s,'auto',false,(fs.rr||0)<-8?'resp_dep':(fs.sbp||0)<-25?'drughypo':undefined); log('Пульс не определяется. Остановка кровообращения.','warn'); G.ui&&G.ui.flash('bad'); }
  else if(s.low.spo2>3*s.D.death||(v.spo2<45&&v.hr<30)){ startArrest(s,'auto',false,(fs.rr||0)<-4?'resp_dep':['hypoxia','hypoxia_child','drown','opioid','fos'].includes(causeId(s))?undefined:'hypoxia'); log('Гипоксия — остановка кровообращения.','warn'); G.ui&&G.ui.flash('bad'); }
  if(v.rh==='vt'&&s.f.kOk&&(s.done['d:ami']!==undefined||s.done['d:mgs']!==undefined)){ Object.assign(v,s.c.rosc); log('ЖТ купирована, синусовый ритм.','good'); }

 if(!inArrest(s)&&s.rearrestAt&&s.t>=s.rearrestAt){ s.rearrestAt=null; if(!roscFixed(s)){ startArrest(s,s.lastArrestRh||'pea'); log('Повторная остановка кровообращения — причина не устранена!','warn'); G.ui&&G.ui.flash('bad'); } }
 (s.c.ev||[]).forEach((e,i)=>{
  if(s.evFired[i]||s.t<e.at*s.D.evAt||inArrest(s)) return;
  if(e.unless&&e.unless.split('|').some(f=>s.f[f])) return;
  if(e.when&&!e.when.split('|').some(f=>s.f[f])) return;
  s.evFired[i]=true; if(e.flag) s.f[e.flag]=true;
  if(e.set&&ARREST.includes(e.set.rh)) startArrest(s,e.set.rh); else if(e.set) Object.assign(v,e.set);

 const due=s.pend.filter(p=>p.at<=s.t); s.pend=s.pend.filter(p=>p.at>s.t);
 due.forEach(p=>{ log(p.lazy?EXAMS.find(e=>e.id===p.lazy).n+': '+exText(s,p.lazy):p.text,p.cls); if(p.flag) s.f[p.flag]=true; if(p.set==='iv') s.iv=true; if(p.set==='chb'&&!inArrest(s)){ s.v.rh='chb'; s.v.hr=34; } if(p.arrest&&!inArrest(s)){ startArrest(s,p.arrest,false,p.cause); G.ui&&G.ui.flash('bad'); } });
 if(s.t>s.flavT){ s.flavT=s.t+rnd(9,18); log(pick(FLAVOR[s.loc]),'muted'); }
 worldTick(s);
 G.ui&&G.ui.render();
}
function die(s){ s.dead=true; log('Реанимационные мероприятия без эффекта. Констатирована биологическая смерть.','warn'); finish('death'); }

</script>
<script>
// Фармакология и физиология.
// 1) Эффект препарата развивается и проходит во времени (начало, плато, угасание), а не прибавляется навсегда.
// 2) Повторные дозы гемодинамических препаратов дают убывающий прирост; депрессанты дыхания, наоборот, суммируются.
// 3) Передозировка — по числу доз за час, с токсическим эффектом и штрафом.
// 4) Показатели связаны: гиповентиляция → гипоксия → брадикардия → остановка; гипотензия → тахикардия (барорефлекс)
//    → при САД ≤45 пульс теряется; ЧСС не выше физиологического максимума; при очень высокой ЧСС падает наполнение.

// on — минуты до пика, dur — длительность, keep — доля эффекта, остающаяся надолго (жидкости, кровь, согревание)
const PK={
 adr:{on:0.5,dur:6},nor:{on:2,dur:90},dop:{on:2,dur:90},dob:{on:2,dur:90},atr:{on:1,dur:30},ami:{on:2,dur:60},lid:{on:1,dur:15},
 mgs:{on:2,dur:60},ver:{on:2,dur:30},atf:{on:0.2,dur:1},prc:{on:3,dur:60},met:{on:3,dur:180},esm:{on:1,dur:20},
 ntg:{on:2,dur:20},cap:{on:15,dur:240},mox:{on:30,dur:480},ura:{on:3,dur:120},enl:{on:15,dur:360},fur:{on:5,dur:120},dig:{on:20,dur:600},
 nif:{on:15,dur:240},sal:{on:3,dur:120},ber:{on:3,dur:180},eup:{on:5,dur:120},
 mor:{on:5,dur:180,dep:1},fen:{on:2,dur:45,dep:1},trm:{on:10,dur:240,dep:1},mtz:{on:15,dur:240},par:{on:30,dur:240},ibu:{on:30,dur:360},
 dzp:{on:2,dur:120,dep:1},mdz:{on:2,dur:60,dep:1},pro:{on:0.5,dur:10,dep:1},ktm:{on:1,dur:15},roc:{on:1,dur:45},sux:{on:1,dur:8},
 nal:{on:1,dur:45},glg:{on:10,dur:60,keep:0.3},man:{on:15,dur:180},flu:{on:1,dur:45},hal:{on:10,dur:240,dep:1},
 g40:{on:1,dur:30,keep:0.3},g5:{on:10,dur:60,keep:0.5},ins:{on:10,dur:120},
 nac:{on:1,dur:40,keep:0.35},rin:{on:1,dur:40,keep:0.35},gel:{on:1,dur:60,keep:0.5},warmfl:{on:1,dur:30,keep:0.6},
 ery:{on:5,dur:60,keep:0.9},ffp:{on:5,dur:60,keep:0.6},hct:{on:30,dur:480},cac:{on:1,dur:20},cag:{on:1,dur:20},
};
const PK_DEF={on:3,dur:60};
// Сколько введений за час — уже передозировка (для взрослого).
const MAXD={mor:3,fen:4,trm:3,dzp:3,mdz:3,pro:3,ktm:4,hal:3,adr:3,ami:3,lid:3,ver:2,met:3,prc:1,dig:2,ntg:8,cap:3,mox:2,ura:4,enl:3,nif:3,
 fur:3,glg:3,man:3,nac:8,rin:8,gel:4,g40:5,ins:3,kcl:3,mgs:3,par:2,ibu:2,mtz:2,sal:8,ber:8,eup:2,atr:6,sod:4,cag:4,cac:4,nal:10,clo:1,tic:1,asa:2,hep:3,enx:2};
const HEMO=['sbp','dbp','hr'];

function maxHR(s){ return s.c.child?200:Math.max(140,Math.min(185,220-s.age)); }

// Назначение препарата: вместо мгновенной прибавки — эффект во времени.
function giveDrug(s,id,fx,isCaseTx){
 const pk=PK[id]||PK_DEF;
 s.fxq=s.fxq||[];
 const sameActive=s.fxq.filter(e=>e.id===id&&e.f>0.3).length;
 const depActive=s.fxq.some(e=>e.dep&&e.id!==id&&e.f>0.3);
 const scaled={};
 for(const k in fx){
  let v=fx[k];
  if(HEMO.includes(k)) v=v/(1+0.6*sameActive);                     // убывающий прирост
  if(pk.dep&&(k==='rr'||k==='gcs')&&depActive) v=v*1.4;             // синергизм опиоидов и седативных
  scaled[k]=v;
 }
 s.fxq.push({id,fx:scaled,t0:s.t,on:pk.on,dur:pk.dur,keep:pk.keep||0,f:0,dep:!!pk.dep,tx:!!isCaseTx});
 // Передозировка
 const n=s.acts.filter(a=>a.t>s.t-60&&(a.key==='d:'+id||a.key.startsWith('d:'+id+'#'))).length;
 let lim=MAXD[id]; if(lim&&s.c.child) lim=Math.max(1,Math.ceil(lim/2));
 if(id==='atr'&&s.c.id==='fos') lim=null;
 if(lim&&n>lim){
  s.overdose=s.overdose||{};
  const d=DRUGS.find(x=>x.id===id);
  if(!s.overdose[id]){ s.overdose[id]=1; s.badHits.push({t:'Передозировка: '+d.n+' — '+n+' введений за час.',w:15}); }
  const tox={};
  if(pk.dep){ tox.rr=-5; tox.gcs=-2; tox.sbp=-2; }
  else if(['adr','dop','nor','dob','atr','eup','sal','ber'].includes(id)){ tox.hr=18; tox.sbp=12; }
  else if(id==='mgs'){ tox.rr=-4; tox.sbp=-10; tox.hr=-8; tox.gcs=-1; }
  else if(['ntg','cap','mox','ura','enl','nif','fur','met','ver','esm','ami'].includes(id)){ tox.sbp=-14; tox.hr=id==='met'||id==='ver'||id==='ami'?-10:6; }
  else if(id==='ins'){ tox.glu=-3; }
  else if(id==='g40'){ tox.glu=4; }
  if(Object.keys(tox).length){ s.fxq.push({id,fx:tox,t0:s.t,on:pk.on,dur:pk.dur,keep:0,f:0,dep:!!pk.dep,tox:true});
   log('Передозировка: '+d.n.toLowerCase()+' — '+n+' введений за час. '+(pk.dep?'Нарастает угнетение дыхания и сознания.':'Нарастают побочные эффекты.'),'warn'); }
  if(id==='adr'&&!inArrest(s)&&Math.random()<0.25){ s.pend.push({at:s.t+1,text:'На мониторе — пробежки желудочковой тахикардии.',cls:'warn'}); }
 }
}

// Применение изменения с физиологическими границами: «лечебное» снижение ЧДД/ЧСС не уводит ниже нормы,
// жидкости не поднимают давление выше 150, САД тянет за собой ДАД.
const NEG_CHRONO=['met','ver','esm','ami','dig','mgs','prc','dzp','mdz','pro','mor','fen','trm','dex'];
function applyDelta(s,e,k,d){
 const v=s.v, dep=e.dep||e.tox;
 if(k==='rr'&&d<0&&!dep&&!['roc','sux'].includes(e.id)){ v.rr=Math.max(v.rr+d,Math.min(v.rr,12)); return; }   // миорелаксанты — апноэ
 if(k==='hr'&&d<0&&!dep&&!NEG_CHRONO.includes(e.id)){ v.hr=Math.max(v.hr+d,Math.min(v.hr,60)); return; }
 if(k==='sbp'&&d>0&&['nac','rin','gel','warmfl','ery','ffp','g5'].includes(e.id)){ d=v.sbp>150?0:Math.min(d,150-v.sbp); }
 if(k==='spo2'&&d>0){ v.spo2=Math.min(100,v.spo2+d); return; }
 v[k]=(v[k]||0)+d;
 if(k==='sbp'&&!(e.fx.dbp)) v.dbp+=d*0.6;
}
// Кривая действия: нарастание до пика, плато, угасание до остаточной доли.
function fxCurve(e,el){
 const a=el;
 if(a<=0) return 0;
 if(a<e.on) return a/e.on;
 const plateau=e.on+e.dur*0.6, end=e.on+e.dur;
 if(a<plateau) return 1;
 if(a<end) return 1-(a-plateau)/(end-plateau)*(1-e.keep);
 return e.keep;
}
function pharmTick(s){
 const sum={};
 for(const e of (s.fxq||[])){
  const f=fxCurve(e,s.t-e.t0), df=f-e.f; e.f=f;
  for(const k in e.fx){ sum[k]=(sum[k]||0)+e.fx[k]*f; if(df&&!inArrest(s)) applyDelta(s,e,k,e.fx[k]*df); }
 }
 s.fxq=(s.fxq||[]).filter(e=>s.t-e.t0<e.on+e.dur+1||e.keep>0);
 s.fxSum=sum;
}

// Связанная физиология (вызывается каждый шаг, вне остановки).
function physiology(s,dt){
 const v=s.v, mx=maxHR(s), sinus=['sinus','stach','sbrady','stemi'].includes(v.rh);
 const blocked=(s.fxSum&&(s.fxSum.hr||0)<-8)||['chb','peakT'].includes(v.rh);
 // Барорефлекс: при падении давления растёт ЧСС (если ритм синусовый и не заблокирован)
 if(sinus&&!blocked&&v.sbp<95){ const target=Math.min(mx,Math.max(v.hr,(s.v0.hr||80)+(95-v.sbp)*0.9)); if(v.hr<target) v.hr+=(target-v.hr)*Math.min(1,0.5*dt); }
 // Гиповентиляция → гипоксия
 // при гипотермии потребность в O₂ снижена — редкое дыхание переносится легче
 if(v.rr<10&&!s.f.vent){ v.spo2-=(10-v.rr)*(s.o2?0.35:0.75)*(v.t<33?0.35:1)*dt; if(v.rr<=2) v.spo2-=4*dt; }
 if(v.rr<6) v.gcs-=0.4*dt;
 // Гипогликемия → адренергический ответ (тахикардия)
 if(v.glu<3.2&&sinus&&!blocked&&v.hr<125) v.hr+=3*dt;
 // Гипоксия → брадикардия
 if(v.spo2<75){ v.hr-=(75-v.spo2)*0.25*dt; }
 // Очень частый ритм — короче диастола, меньше выброс
 if(v.hr>mx*0.85&&v.rh!=='afib'&&v.rh!=='svt') v.sbp-=(v.hr-mx*0.85)*0.12*dt;
 // Потолок ЧСС для синусового ритма
 if(sinus&&v.hr>mx) v.hr=mx;
 if(['afib','vt'].includes(v.rh)&&v.hr>mx+15) v.hr=mx+15;
 if(v.hr>165&&v.rh==='sinus') v.rh='stach';
}

const CLS={

 const s=G.s; if(!s||s.over) return; const c=CONS.find(x=>x.id===id);
 if(s.cons.some(x=>x.id===id)){ log(consName(c,s.loc)+': «Я уже всё сказал(а), коллега».','muted'); return; }
 const d=(c.d&&c.d[s.loc])||10, txt=s.c.cons&&s.c.cons[id];
 s.cons.push({id,t:s.t,rel:!!txt}); record(s,'c:'+id);
 log('Вызов: '+consName(c,s.loc)+(d?` — будет через ~${d} мин.`:'.'),'act');
 s.pend.push({at:s.t+Math.max(0.3,d*(0.8+Math.random()*0.4)),cls:'cons',wait:consName(c,s.loc).split(' ')[0],text:consName(c,s.loc)+': «'+(txt||pick(CONS_OFF))+'»'});
 if(!txt&&s.D.cons) s.badHits.push({t:'Консультация не по профилю: '+consName(c,s.loc)+'.',w:s.D.cons});
 G.ui&&G.ui.render();
}
function nextNeed(s){
 return (s.c.need||[]).filter(n=>(!n.loc||n.loc===s.loc)&&!(n.c&&!n.c(s))&&!n.k.split('|').some(k=>s.done[k]!==undefined)).sort((a,b)=>a.by-b.by)[0];
}
function hint(){
 const s=G.s; if(!s||s.over) return; const n=nextNeed(s);
 s.hints++;
 const txt=inArrest(s)?arrestHint(s):n?'Сейчас важнее всего: '+n.t+'.':'По основному всё сделано. Подумайте о маршруте и документах.';
 s.hintLog.push({t:s.t,txt}); log('Подсказка старшего: '+txt,'cons');
 G.ui&&G.ui.render();
}

// ── Форс-мажоры
function worldTick(s){
 if(!s.fmQueue&&!s.talk&&s.t>=s.fmNext&&s.fmCount<s.D.fm&&!inArrest(s)){
  const list=(FM[s.loc]||[]).filter(e=>(s.D.id==='hard'||!e.hard)&&(!e.speak||canSpeak(s))); const used=s.fmLog.map(x=>x.ev);
  const ev=pick(list.filter(e=>!used.includes(e)));
  if(ev){ s.fmQueue=ev; s.fmCount++; s.fmNext=s.t+(s.D.id==='hard'?rnd(5,10):rnd(10,20)); G.ui&&G.ui.fm(s,ev); }
 }
 if(!s.talk&&!s.fmQueue&&talkReady(s)) startTalk();
}
function fmChoose(i,late){
 const s=G.s, ev=s.fmQueue; if(!ev) return; const o=ev.o[i];
 s.fmLog.push({ev,choice:(late?'Не успели решить → ':'')+o.t,s:o.s}); s.fmQueue=null;
 const L=s.D.lock;
 if(o.lock){ for(const k in o.lock){ if(k==='exam') s.lock['exam:'+o.lock.exam]=s.t+o.lock.min*L; else if(k==='drug') s.lock['drug:'+o.lock.drug]=s.t+o.lock.min*L; else if(k!=='min') s.lock[k]=s.t+o.lock[k]*L; } }
 if(o.fx) applyFx(s,o.fx);
 if(o.time){ s.t+=o.time; for(const k in s.dr) s.v[k]+=s.dr[k]*o.time; normalize(s); }
 log('Форс-мажор: '+o.t,'act'); if(o.msg) log(o.msg,'res');

// ── Оформление: диагноз, маршрут, документы
function dxOptions(s){
 const c=s.c, opts=[{n:c.dxShort||c.dx,icd:c.icd||'',ok:true}].concat((c.ddx||[]).map(([n,icd])=>({n,icd,ok:false})));
 return opts.sort(()=>Math.random()-0.5);
}
function deptOptions(s){ return DEPTS.filter(d=>avail(d.at,s.loc)); }
function docOptions(s){ return DOCS.filter(d=>avail(d.at,s.loc)); }
function requiredDocs(s,dept){
 const req=new Set((s.c.docs||[]).filter(id=>{ const d=DOCS.find(x=>x.id===id); return d&&avail(d.at,s.loc); }));
 if(s.f.refused&&dept==='home') req.add('refuse');
 if(s.f.hadArrest) req.add('cpr');
 if(s.f.fix&&avail('smp pri orit',s.loc)) req.add('fix');
 if(s.c.id==='delirium'&&dept!=='psych'&&dept!=='narco') req.delete('inv29');
 if(s.c.id==='delirium'&&s.f.consent) req.delete('inv29');

}
function needsConsentTalk(s,dept){ const T=s.c.talk; return T&&T.when==='dispo'&&!s.talkDone&&dept!=='home'; }
function submitDispo(sel){
 const s=G.s; if(!s||s.over) return;
 const dept=DEPTS.find(d=>d.id===sel.dept);
 record(s,'g:'+dept.id); if(dept.k) record(s,dept.k); checkBad(s,'g:'+dept.id);
 const route=(s.c.route&&s.c.route[s.loc])||[];
 const req=requiredDocs(s,dept.id);
 const docsOk=req.filter(d=>sel.docs.includes(d)), docsMiss=req.filter(d=>!sel.docs.includes(d));
 const docsExtra=sel.docs.filter(d=>!req.includes(d)&&['refuse','inv29','fix',...(s.c.docsBad||[])].includes(d));
 for(const d of sel.docs) if((s.c.docsBad||[]).includes(d)) s.badHits.push({t:s.c.docsBadText||'Документ без оснований: '+((DOCS.find(x=>x.id===d)||{}).n||d)+'.',w:15});
 s.dispo={dx:sel.dx,dxOk:!!sel.dx.ok,dept,deptOk:route.includes(dept.id),route,req,docsOk,docsMiss,docsExtra,hurdle:sel.hurdle};
 if(s.f.refused&&dept.id!=='home'&&!['psych','narco'].includes(dept.id)) s.badHits.push({t:'Госпитализация без согласия дееспособного пациента, отказавшегося от неё (ст. 20 ФЗ-323).',w:15});
 if(dept.id==='home'&&!s.f.refused&&route.length&&!route.includes('home')) s.badHits.push({t:'Пациент с показаниями к госпитализации оставлен дома.',w:25});

}
// Реплики от лица пациента — только если он в ясном сознании, взрослый и не в остановке
function canSpeak(s){ return !inArrest(s)&&!s.c.child&&s.v.gcs>=14&&!s.f.intub; }
function pickHurdle(s){ const list=HURDLES.filter(h=>avail(h.at,s.loc)&&(!h.speak||canSpeak(s))); return list.length&&Math.random()<s.D.hurdle?pick(list):null; }

<script>
// Движок v2, часть 3: итог и оценка.
function finish(reason){
 const s=G.s; if(!s||s.over) return; s.over=true; s.end=reason;
 const res={got:0,max:0,rows:[],bad:s.badHits.slice(),parts:[]};
 for(const n of s.c.need){
  if(n.loc&&n.loc!==s.loc) continue;
  if(n.c&&!n.c(s)) continue;
  res.max+=n.w;
  let when=Infinity; n.k.split('|').forEach(k=>{ if(s.done[k]!==undefined) when=Math.min(when,s.done[k]); });
  let pts=0, st='n';
  if(when<=n.by){ pts=n.w; st='y'; } else if(when<Infinity){ pts=Math.round(n.w/2); st='late'; }
  res.got+=pts; res.rows.push({t:n.t,st,when,pts,w:n.w});
 }
 const part=(name,got,max)=>{ res.parts.push({name,got,max}); res.got+=got; res.max+=max; };
 // Оформление
 const D=s.dispo;
 if(D){
  part('Диагноз',D.dxOk?10:0,10);
  part('Маршрутизация',D.deptOk?15:0,15);
  part('Документы',Math.max(0,D.docsOk.length*3-D.docsExtra.length*3),Math.max(D.req.length*3,0));
  if(D.hurdle) part('Бюрократия',Math.max(0,D.hurdle.s),10);
  if(D.hurdle&&D.hurdle.s<0) res.bad.push({t:'Бюрократия: '+D.hurdle.t,w:-D.hurdle.s});
 } else if(!['death','flee'].includes(reason)) { part('Диагноз',0,10); part('Маршрутизация',0,15); }
 // Реанимация: каждая остановка — отдельный раздел с баллами
 if(s.arrest&&s.arrest.ep&&s.arrest.ep.end===null) closeEp(s,s.dead?'death':'ongoing');
 res.arrests=(s.arrests||[]).map(ep=>{ const rows=evalArrest(s,ep); const got=rows.reduce((x,r)=>x+r.got,0), max=rows.reduce((x,r)=>x+r.max,0); part('Реанимация №'+ep.n,got,max); return {ep,rows,got,max}; });
 // Форс-мажоры
 s.fmLog.forEach(f=>{ part('Форс-мажор',Math.max(0,f.s),5); if(f.s<0) res.bad.push({t:'Форс-мажор: '+f.choice,w:-f.s}); });
 // Диалог
 if(s.talkLog.length){ const g=s.talkLog.filter(x=>x.good).length; part('Разговор с пациентом',Math.round(10*g/s.talkLog.length),10); }
 if(s.hints&&s.D.hint) res.bad.push({t:'Подсказки старшего ×'+s.hints,w:s.hints*s.D.hint});
 const pen=res.bad.reduce((a,b)=>a+b.w,0);
 let pct=res.max?Math.round(100*(res.got-pen)/res.max):0; pct=clamp(pct,0,100);
 if(s.dead) pct=Math.min(pct,25);
 if(reason==='flee') pct=Math.min(pct,30);
 if(inArrest(s)&&!s.dead) pct=Math.min(pct,35);
 res.pct=pct; res.pen=pen;
 const stable=!inArrest(s)&&s.v.sbp>=85&&s.v.spo2>=90;
 res.outcome=s.dead?'Пациент умер':reason==='flee'?'Пациент ушёл':(inArrest(s)?'Передан в остановке кровообращения':(stable?'Пациент стабилен':'Пациент нестабилен'));
 res.reason=D?D.dept.n:({manual:'Без оформления',death:'Летальный исход',flee:'Ушёл до госпитализации'}[reason]||'');
 s.res=res;
 G.ui&&G.ui.end(s);
}

(()=>{ const d=DRUGS.find(x=>x.id==='adr'); if(d) d.d.push({t:'0,01 мг/кг в/в или в/к (СЛР у ребёнка)',kid:1,kd:{mg:0.01,max:1,u:'мг'},fx:{}}); })();

const mmss=m=>{ const t=Math.max(0,Math.round(m*60)); return Math.floor(t/60)+':'+String(t%60).padStart(2,'0'); };
function rhythmText(s){
 const v=s.v;
 return ({vf:'хаотичные волны разной амплитуды, комплексов QRS нет',fvf:'мелкие хаотичные волны низкой амплитуды, комплексов нет',

const ventOk=s=>!!(s.f.intub||(s.arrest&&(s.arrest.vent||s.arrest.sga)));

 hypoxia:{n:'Гипоксия',rh:[['pea',3],['asys',2]],fix:ventOk,how:'проходимость дыхательных путей и вентиляция 100% O₂'},

 hypovol:{n:'Гиповолемия',rh:[['pea',4],['asys',1]],fix:s=>volGiven(s)>=2||s.done['d:ery']!==undefined,how:'струйная инфузия, кровь, остановка кровотечения'},
 hyperk:{n:'Гиперкалиемия',rh:[['peaw',3],['vf',2],['asys',1]],fix:s=>!!s.f.ca||s.done['d:cag']!==undefined||s.done['d:cac']!==undefined,how:'кальция хлорид/глюконат 10 мл 10% в/в, бикарбонат, инсулин с глюкозой, диализ'},
 hypok:{n:'Гипокалиемия / гипомагниемия',rh:[['tdp',2],['vf',3]],fix:s=>s.done['d:mgs']!==undefined||s.done['d:kcl']!==undefined,how:'магния сульфат 2 г в/в, калий'},
 hypotherm:{n:'Гипотермия',rh:[['vf',3],['asys',1]],fix:s=>s.v.t>=30,how:'активное согревание до >30 °C, не более 3 разрядов и без адреналина до согревания'},

 tamponade:{n:'Тампонада сердца',rh:[['pea',1]],fix:s=>!!s.f.pcent,how:'перикардиоцентез'},
 tension:{n:'Напряжённый пневмоторакс',rh:[['pea',1]],fix:s=>!!(s.f.decomp||s.f.drain),how:'игольная декомпрессия / торакостомия'},
 opioid:{n:'Токсины: опиоиды',rh:[['asys',2],['pea',2]],fix:ventOk,how:'вентиляция; налоксон — вторично'},
 fos:{n:'Токсины: ФОС',rh:[['pea',2],['asys',1]],fix:s=>!!s.f.atro&&ventOk(s),how:'атропин большими дозами и вентиляция'},
 tca:{n:'Токсины: трициклические антидепрессанты',rh:[['peaw',2],['pvt',2],['vf',1]],fix:s=>s.done['d:sod']!==undefined,how:'натрия гидрокарбонат 1–2 ммоль/кг, СЛР дольше обычного'},
 anaph:{n:'Анафилаксия',rh:[['pea',3]],fix:s=>((s.arrest&&s.arrest.adr>0)||!!s.f.adr)&&volGiven(s)>=1,how:'адреналин и струйная инфузия кристаллоидов'},

 iatro:{n:'Разряд на зубец T (ятрогенная ФЖ)',rh:[['vf',1]],fix:()=>true,how:'немедленная дефибрилляция'},
};
const CASE_CAUSE={stemi_inf:'coronary',hypo:'hypoglyc',opioid:'opioid',stroke:'hypoxia',ape:'hypoxia',anaph:'anaph',asthma:'hypoxia',htn:'coronary',
 dka:s=>s.f.ins&&!s.f.kOk?'hypok':'hyperk',gib:'hypovol',pe:'pe',sepsis:'hypovol',vf:'hypok',eclampsia:'pregnancy',tamponade:'tamponade',pneumo:'tension',
 hyperk:'hyperk',avblock:'avblock',status:'hypoxia',trauma:'hypovol',delirium:'hypok',tbi:'hypoxia',mening:'hypovol',afib:'coronary',croup:'hypoxia_child',
 febseiz:'hypoxia_child',birth:'hypovol',co:'hypoxia',fos:'fos',amanita:'hypovol',burns:'hypoxia',hypo_t:'hypotherm',tutorial:'hypoglyc',

function causeId(s){ const c=s.c.cause||CASE_CAUSE[s.c.id]||'hypoxia'; return typeof c==='function'?c(s):c; }

 s.arrests.push(ep);
 s.arrest={since:s.t,cpr:false,cycleAt:null,cyclePrompt:false,cycleEval:false,shocks:0,adr:0,lastAdr:null,ami:0,
  noflow:0,lowflow:0,vent:!!s.f.intub,sga:false,warned:{},initial:!!initial,ep};
 if(C.fix(s)) ep.fixAt=s.t;
 Object.assign(s.v,{sbp:0,dbp:0,spo2:0,rr:0,gcs:3});

function shockP(s){

 if(a.noflow>3) p-=0.1;
 if(rh==='fvf') p*=0.6; if(rh==='pvt') p*=1.1;
 if(rh==='tdp'&&s.done['d:mgs']===undefined) p*=0.4;
 if(!fixed&&cid!=='coronary') p*=0.05;
 if(cid==='hypotherm'&&s.v.t<30) p=a.shocks<=3?0.03:0;

}
function nonShockP(s){

 if(!a.adr) p*=0.5;

 if(a.ep.cause==='hypotherm'&&s.v.t<30) p=0;

}

// Подсказка старшего во время остановки — следующий шаг алгоритма, без названия причины.

// Оценка одной остановки кровообращения для разбора: строки {t, got, max, note}.

 function cat(cx,t,s,x,y){
  C=cx; const col=['#d98a3d','#8a8f96','#2a2a2a','#efe8da'][s.catCol??(s.catCol=Math.floor(Math.random()*4))], dark=['#a8642a','#5f646b','#111','#c8b89a'][s.catCol];
  const cyc=(t%4)/4, lick=cyc<0.6, paw=lick?Math.sin(cyc/0.6*Math.PI):0, bob=lick?Math.sin(t*14)*2:0;
  kit(x+60,y+2);
  C.strokeStyle=col; C.lineWidth=8; C.lineCap='round'; C.beginPath(); C.moveTo(x-18,y+40); C.quadraticCurveTo(x-48,y+44+Math.sin(t*2)*6,x-46,y+14+Math.sin(t*2.3)*8); C.stroke();
  C.fillStyle=col; C.beginPath(); C.ellipse(x,y+26,26,32,0,0,7); C.fill();
  C.fillStyle=dark; C.beginPath(); C.ellipse(x+16,y+56,10,6,0,0,7); C.fill(); C.beginPath(); C.ellipse(x-12,y+57,10,6,0,0,7); C.fill();
  const hx=x+8, hy=y-14+bob+(lick?4:0);
  C.fillStyle=col; C.beginPath(); C.arc(hx,hy,17,0,7); C.fill();
  C.beginPath(); C.moveTo(hx-14,hy-6); C.lineTo(hx-10,hy-24); C.lineTo(hx-2,hy-12); C.fill(); C.beginPath(); C.moveTo(hx+14,hy-6); C.lineTo(hx+10,hy-24); C.lineTo(hx+2,hy-12); C.fill();
  C.fillStyle='#e6a6b0'; C.beginPath(); C.moveTo(hx-11,hy-9); C.lineTo(hx-9,hy-19); C.lineTo(hx-5,hy-11); C.fill();
  C.strokeStyle='#222'; C.lineWidth=2; C.beginPath();
  if(lick){ C.moveTo(hx-8,hy-2); C.lineTo(hx-3,hy-2); C.moveTo(hx+3,hy-2); C.lineTo(hx+8,hy-2); } else { C.arc(hx-5,hy-2,2,0,7); C.moveTo(hx+7,hy-2); C.arc(hx+5,hy-2,2,0,7); }
  C.stroke(); C.fillStyle='#e9a0a8'; C.beginPath(); C.arc(hx,hy+4,2.5,0,7); C.fill();
  // лапка к мордочке
  const px=x+14-paw*4, py=y+46-paw*44;
  C.strokeStyle=col; C.lineWidth=9; C.beginPath(); C.moveTo(x+12,y+40); C.lineTo(px,py); C.stroke(); C.fillStyle=dark; C.beginPath(); C.arc(px,py,5.5,0,7); C.fill();

 }

 stemi_inf:{ru:['КР «Острый инфаркт миокарда с подъёмом сегмента ST» (2024): ЭКГ ≤10 мин от контакта; АСК 150–325 мг + ингибитор P2Y12 (тикагрелор 180 мг или клопидогрел 300–600 мг); НФГ 70–100 ЕД/кг при стратегии первичного ЧКВ.','Первичное ЧКВ, если от диагноза до проводника ≤120 мин; иначе — тромболизис в течение 10 мин (тенектеплаза или отечественная неиммуногенная стафилокиназа — Фортелизин) с последующей КАГ.','Инфаркт правого желудочка: нитраты и диуретики противопоказаны, при гипотонии — болюсы жидкости.'],

 anaph:{ru:['КР «Анафилактический шок»: адреналин 0,1% 0,3–0,5 мг в/м в переднелатеральную поверхность бедра, повтор через 5–15 мин; лёжа с поднятыми ногами; O₂; кристаллоиды 20 мл/кг.','При рефрактерности — адреналин в/в титрованно при мониторинге. ГКС и антигистаминные — вторая линия, не замена адреналину.'],
  intl:['WAO 2020, EAACI 2021, Resuscitation Council UK 2021: адреналин в/м 0,5 мг, повтор через 5 мин; при двух дозах без эффекта — инфузия адреналина. UK 2021 исключил антигистаминные и гидрокортизон из экстренного алгоритма.'],
  cmp:'Адреналин в/м — общий краеугольный камень. За рубежом ГКС и антигистаминные убраны из неотложного этапа, в РФ допускаются как вспомогательные.'},
 asthma:{ru:['КР «Бронхиальная астма» (на основе GINA): КДБА (сальбутамол) через небулайзер повторно, ипратропий при тяжёлом обострении; системные ГКС (преднизолон 40–50 мг) в первый час; O₂ до SpO₂ 93–95%.','Магния сульфат 2 г в/в при тяжёлом обострении без ответа; седативные противопоказаны.'],
  intl:['GINA 2024: те же шаги; аминофиллин не рекомендуется. Долгосрочно — уход от монотерапии КДБА к ИГКС-формотеролу.'],
  cmp:'Практически совпадают: российские КР опираются на GINA.'},
 htn:{ru:['КР «Артериальная гипертензия у взрослых» (2024): неосложнённый криз — постепенное снижение АД (не более чем на 25% за первые часы) пероральными препаратами (каптоприл, моксонидин), лечение амбулаторно; короткодействующий нифедипин под язык не рекомендуется.','В/в препараты и госпитализация — только при поражении органов-мишеней (осложнённый криз).'],
  intl:['ESC 2024 / ESH 2023: «гипертензивная неотложность» без острого поражения органов — не экстренная ситуация: возобновить или усилить постоянную терапию, контроль в течение дней; быстрое снижение вредно.'],
  cmp:'Сходно. Европейцы чётче разделяют urgency и emergency и вообще не рекомендуют «сбивать» давление в неотложке без поражения органов.'},
 dka:{ru:['Алгоритмы специализированной помощи при СД: регидратация 0,9% NaCl 1 л в первый час, инсулин короткого действия в/в 0,1 ЕД/кг/ч, калий с началом инсулинотерапии при K⁺ <5,5; при гликемии 13–14 — добавить 5% глюкозу.','Бикарбонат — только при pH <6,9–7,0.'],
  intl:['Консенсус ADA/EASD по гипергликемическим кризам (2024): предпочтительны сбалансированные кристаллоиды; не начинать инсулин при K⁺ <3,5; бикарбонат при pH <7,0.'],
  cmp:'Принципы одинаковы; международный консенсус 2024 предпочитает сбалансированные растворы и строже относится к стартовому калию.'},
 gib:{ru:['КР по язвенным кровотечениям (РОХ, РГА): оценка шока, два доступа, рестриктивная трансфузия (Hb <70 г/л), ИПП в/в (80 мг болюс + инфузия 8 мг/ч), ЭГДС в первые 24 ч (≤12 ч при нестабильности), эндоскопический гемостаз; отменить НПВП.'],
  intl:['ESGE 2021, ACG 2021: шкала Глазго–Блэтчфорд, порог трансфузии Hb 70 (80 при ИБС), ИПП, ЭГДС ≤24 ч; транексамовая кислота не рекомендуется (исследование HALT-IT).'],
  cmp:'Совпадают; в обеих школах транексамовая кислота при ЖКК больше не рекомендуется.'},
 pe:{ru:['КР «Лёгочная эмболия» (2024): высокий риск (шок) — НФГ болюс и системный тромболизис (алтеплаза 100 мг за 2 ч, отечественные альтернативы — по инструкции), норадреналин при гипотонии, инфузия не более 500 мл.','При противопоказаниях к ТЛТ — хирургическая или катетерная эмболэктомия.'],
  intl:['ESC/ERS 2019: немедленная НФГ и системный тромболизис у пациента высокого риска, норадреналин, избегать агрессивной инфузии; команда PERT.'],
  cmp:'Одинаковая логика, различие — в доступных тромболитиках.'},
 sepsis:{ru:['КР «Сепсис (у взрослых)»: в первый час — лактат, посевы крови до антибиотиков, антибиотики широкого спектра, кристаллоиды 30 мл/кг при гипотонии или лактате ≥4, норадреналин для САД ≥65.'],
  intl:['Surviving Sepsis Campaign 2021: тот же «пакет первого часа»; сбалансированные кристаллоиды предпочтительнее NaCl; норадреналин — первая линия (можно через периферический катетер); гидрокортизон при потребности в вазопрессорах.'],
  cmp:'Совпадают: российские КР основаны на Surviving Sepsis Campaign.'},
 vf:{ru:['Национальный совет по реанимации (на основе ERC 2021): ранний разряд, 2 минуты СЛР между анализами ритма; адреналин 1 мг после 3-го разряда и далее каждые 3–5 мин; амиодарон 300 мг после 3-го, 150 мг после 5-го разряда; поиск 4Г/4Т.'],
  intl:['ERC 2021, AHA 2025: та же последовательность; при свидетельной ФЖ на мониторе — до трёх разрядов подряд; лидокаин — альтернатива амиодарону.'],
  cmp:'Алгоритмы почти идентичны: российские рекомендации основаны на ERC.'},
 eclampsia:{ru:['КР «Преэклампсия. Эклампсия. Отёки, протеинурия и гипертензивные расстройства во время беременности…»: магния сульфат 4–6 г в/в нагрузочно за 15–20 мин, затем 1–2 г/ч; антигипертензивные при АД ≥160/110 (нифедипин, урапидил); родоразрешение после стабилизации.','Положение на левом боку; контроль диуреза, рефлексов и ЧДД (антидот магния — кальция глюконат).'],
  intl:['ACOG 2020, NICE NG133: магний — та же схема; при АД ≥160/110 — лабеталол в/в, гидралазин или нифедипин внутрь; единственное радикальное лечение — родоразрешение.'],
  cmp:'Магний везде основа. Лабеталол и гидралазин, популярные за рубежом, в РФ малодоступны — используют урапидил и нифедипин.'},
 tamponade:{ru:['КР по заболеваниям перикарда: ЭхоКГ для подтверждения, при тампонаде — перикардиоцентез под УЗИ-контролем; до процедуры — поддержка преднагрузки инфузией; диуретики и нитраты противопоказаны.'],
  intl:['ESC по заболеваниям перикарда (2015, обновление 2025): неотложный перикардиоцентез или хирургический дренаж; балльная схема сортировки для выбора срочности.'],
  cmp:'Совпадают.'},
 pneumo:{ru:['КР «Пневмоторакс» и алгоритмы СМП: напряжённый пневмоторакс — клинический диагноз, немедленная игольная декомпрессия, затем дренирование плевральной полости.'],
  intl:['ATLS (10-е изд.): у взрослых пункция в 4–5 межреберье по передней/средней подмышечной линии; BTS 2023: дренаж после декомпрессии.'],
  cmp:'Одинаково. ATLS сместил предпочтительную точку пункции к подмышечной линии из-за толщины грудной стенки во 2-м межреберье.'},
 hyperk:{ru:['КР по ХБП и алгоритмы неотложной помощи: при изменениях ЭКГ — кальция глюконат 10% 10–30 мл в/в; перераспределение калия — инсулин 10 ЕД с глюкозой, сальбутамол через небулайзер; выведение — экстренный гемодиализ у диализного пациента.'],
  intl:['UK Kidney Association 2023, KDIGO: кальций, инсулин–глюкоза, сальбутамол; бикарбонат не рутинно; калий-связывающие препараты (циклосиликат циркония, патиромер); диализ.'],
  cmp:'Совпадают; новые калий-связывающие препараты в РФ малодоступны.'},
 avblock:{ru:['КР «Брадиаритмии и нарушения проводимости»: нестабильная брадикардия — атропин 0,5–1 мг (до 3 мг), затем адреналин или допамин инфузией и временная ЭКС; отменить блокирующие препараты (бета-блокатор + верапамил + дигоксин).'],
  intl:['ERC 2021 (атропин 0,5 мг) и AHA (атропин 1 мг) до 3 мг; затем адреналин 2–10 мкг/мин или допамин, ЭКС; при полной блокаде с широким QRS атропин часто неэффективен.'],
  cmp:'Одинаково; разница только в стартовой дозе атропина.'},
 status:{ru:['КР «Эпилепсия и эпилептический статус у взрослых и детей»: 1-я линия — бензодиазепин (диазепам 10 мг в/в, мидазолам 10 мг в/м/буккально), повтор через 5–10 мин; 2-я — вальпроевая кислота, леветирацетам или фенитоин в/в; 3-я — наркоз с ИВЛ. Глюкоза, тиамин при алкоголизме.'],
  intl:['AES 2016, ESETT 2019, NICE: бензодиазепин на 5-й минуте; к 20-й — леветирацетам, вальпроат или фосфенитоин (по ESETT эквивалентны); с 40-й — рефрактерный статус и наркоз.'],
  cmp:'Совпадают; исследование ESETT подтвердило равную эффективность трёх препаратов второй линии.'},
 trauma:{ru:['КР по политравме и алгоритмы СМП: сначала остановить наружное кровотечение (жгут), тазовый бандаж, допустимая гипотензия (САД 80–90), транексамовая кислота 1 г в первые 3 ч, ранняя трансфузия, травмоцентр I уровня.'],
  intl:['ATLS (10-е изд.), Европейское руководство по кровотечению при травме 2023: <C>ABCDE, жгут, тазовый бандаж, TXA ≤3 ч, ограничение кристаллоидов, сбалансированная трансфузия, damage control.'],
  cmp:'Одинаково: российская практика основана на ATLS и европейском руководстве.'},
 delirium:{ru:['КР «Психические и поведенческие расстройства, вызванные употреблением алкоголя (синдром отмены)»: бензодиазепины — основа (диазепам в/в титрованно), тиамин 100–200 мг в/в до глюкозы, коррекция электролитов; галоперидол — только в дополнение к бензодиазепинам.'],
  intl:['ASAM 2020, NICE CG100: бензодиазепины по симптомам (шкала CIWA-Ar), тиамин парентерально, антипсихотики только как дополнение; фенобарбитал — альтернатива.'],
  cmp:'Совпадают.'},
 tbi:{ru:['КР «Черепно-мозговая травма»: КТ при изменении сознания; ГКС ≤8 — интубация; САД ≥110, SpO₂ >94%; эпидуральная гематома с объёмом >30 мл или компрессией — экстренная трепанация.'],
  intl:['Brain Trauma Foundation 2016: избегать гипоксии и гипотонии; гипервентиляция — только кратковременно при вклинении; маннитол или гипертонический NaCl — мост к операции.'],
  cmp:'Совпадают.'},
 mening:{ru:['КР «Менингококковая инфекция у взрослых»: при подозрении на менингококцемию — антибиотик немедленно, на догоспитальном этапе (цефтриаксон 2 г; при инфекционно-токсическом шоке традиционно — левомицетина сукцинат); противошоковая терапия; инфекционный стационар, экстренное извещение.'],
  intl:['NICE NG240 (2024), ESCMID: парентеральный цефтриаксон немедленно при подозрении; дексаметазон при бактериальном менингите вместе с первой дозой антибиотика; химиопрофилактика контактов.'],
  cmp:'Общий принцип — «антибиотик сразу». Левомицетин при шоке — российская традиция, за рубежом не применяется.'},
 afib:{ru:['КР «Фибрилляция и трепетание предсердий у взрослых»: нестабильность — синхронизированная ЭИТ; стабильная ФП <48 ч — кардиоверсия (амиодарон, новокаинамид или ЭИТ) на фоне антикоагуляции; контроль ЧСС — бета-блокаторы или верапамил; CHA₂DS₂-VASc и антикоагулянты.'],
  intl:['ESC AF 2024 (AF-CARE): нестабильность — ЭИТ; ранняя кардиоверсия не обязательна, допустима выжидательная тактика до 48 ч; риск инсульта по шкале CHA₂DS₂-VA (без учёта пола).'],
  cmp:'ESC 2024 допускает «подождать» и перешёл на шкалу без пола; российские КР ориентируются на CHA₂DS₂-VASc.'},
 croup:{ru:['КР «Острый обструктивный ларингит [круп] и эпиглоттит у детей»: дексаметазон 0,15–0,6 мг/кг или будесонид через небулайзер; при тяжёлом — адреналин через небулайзер; ребёнок на руках у мамы, не беспокоить; паровые ингаляции не рекомендуются.'],
  intl:['AAP, Канадское педиатрическое общество, NICE: однократный дексаметазон 0,15–0,6 мг/кг внутрь всем; небулизированный адреналин при среднетяжёлом и тяжёлом; увлажнённый воздух неэффективен.'],
  cmp:'Совпадают; в РФ шире используется будесонид через небулайзер.'},
 febseiz:{ru:['КР «Фебрильные судороги»: судороги >5 мин — диазепам ректально 0,5 мг/кг или мидазолам буккально/интраназально 0,3 мг/кг; жаропонижающие в возрастной дозе (повтор не предотвращают); обтирания спиртом и уксусом запрещены.'],
  intl:['AAP 2011, NICE: при простых фебрильных судорогах ЭЭГ и визуализация не нужны; приступ >5 мин — бензодиазепин (буккальный мидазолам); антипиретики — для комфорта.'],
  cmp:'Совпадают.'},
 birth:{ru:['КР «Роды одноплодные, самопроизвольное родоразрешение…»: защита промежности, новорождённого обсушить и согреть, отсроченное пережатие пуповины (≥60 с), окситоцин 10 ЕД в/м после рождения ребёнка; не тянуть за пуповину без признаков отделения плаценты.'],
  intl:['ВОЗ 2018, NICE: активное ведение третьего периода — окситоцин 10 ЕД в/м, пережатие пуповины через 1–3 мин, контролируемая тракция — только обученным персоналом.'],
  cmp:'Совпадают.'},
 co:{ru:['КР «Токсическое действие окиси углерода»: прекратить экспозицию, 100% O₂ через маску с резервуаром независимо от SpO₂, карбоксигемоглобин, ЭКГ и тропонин; ГБО — при потере сознания, неврологии, беременности, высоком COHb.'],
  intl:['ACEP Clinical Policy 2017, UHMS: нормобарический 100% O₂ до исчезновения симптомов (обычно ≥6 ч); польза ГБО обсуждается, показания — индивидуально.'],
  cmp:'Совпадают; показания к ГБО везде спорные.'},
 fos:{ru:['КР по отравлениям ФОС и алгоритмы: деконтаминация, атропин 1–3 мг в/в с удвоением каждые 5 мин до «атропинизации» (сухие лёгкие, ЧСС >80, САД >80); реактиватор холинэстеразы (дипироксим) — рано; бензодиазепины при судорогах; суксаметоний противопоказан.'],
  intl:['Протоколы Eddleston и ВОЗ: атропин по схеме удвоения; оксимы (пралидоксим) — польза в РКИ ограничена; суксаметоний не применять.'],
  cmp:'Совпадают; реактиваторы разные (дипироксим в РФ, пралидоксим за рубежом).'},
 amanita:{ru:['Токсикологические рекомендации: активированный уголь повторно, инфузия, ацетилцистеин, бензилпенициллин в высоких дозах, контроль функции печени, раннее обращение в центр трансплантации; лоперамид противопоказан.'],
  intl:['Европейская практика: силибинин в/в — препарат выбора, ацетилцистеин; пенициллин — слабая доказательность; критерии King’s College для трансплантации.'],
  cmp:'За рубежом основа — силибинин в/в, в РФ он практически недоступен, поэтому шире используют пенициллин.'},
 burns:{ru:['КР «Ожоги термические и химические…»: охлаждение проточной водой 20 мин (не лёд), оценка площади, обезболивание опиоидами/кетамином, инфузия по формуле Паркланда при ожоге >15–20% ТПО; признаки ингаляционной травмы — ранняя интубация; ожоговый центр.'],
  intl:['ISBI 2016, ABA: те же меры; целевой диурез 0,5 мл/кг/ч, избегать перегрузки жидкостью («fluid creep»).'],
  cmp:'Совпадают.'},
 hypo_t:{ru:['КР по гипотермии и рекомендации НСР: бережное обращение (риск ФЖ), снять мокрую одежду, активное наружное согревание туловища, растворы 38–42 °C; растирания снегом и спиртом запрещены; при остановке — центр с ЭКМО; адреналин не вводить при <30 °C.'],
  intl:['ERC 2021, Wilderness Medical Society 2019: те же меры; при остановке и <30 °C — до трёх разрядов, адреналин отложить; согревание на ЭКМО.'],
  cmp:'Совпадают (российские основаны на ERC).'},
 tdp:{ru:['КР по желудочковым нарушениям ритма: torsades de pointes — магния сульфат 2 г в/в независимо от уровня Mg, отмена препаратов, удлиняющих QT (здесь амиодарон + кларитромицин), калий до 4,5–5,0; учащающая ЭКС при брадизависимой форме; без пульса — дефибрилляция.'],
  intl:['ESC VA 2022, AHA: магний в/в, отмена QT-удлиняющих, калий 4,5–5,0, overdrive pacing; амиодарон противопоказан.'],
  cmp:'Совпадают.'},
 pregarrest:{ru:['Рекомендации НСР (ERC 2021): у беременной — ручное смещение матки влево, раннее обеспечение дыхательных путей, акушерская и неонатальная бригады; перимортальное кесарево сечение, если ROSC нет к 4-й минуте.','Причина здесь — ТЭЛА: тромболизис во время СЛР.'],
  intl:['AHA (материнская остановка) и ERC 2021: то же; родоразрешение в течение 5 минут от остановки.'],
  cmp:'Совпадают.'},
 tca:{ru:['КР по отравлениям антидепрессантами: QRS >100 мс — натрия гидрокарбонат 1–2 ммоль/кг в/в болюсами до pH 7,45–7,55; судороги — бензодиазепины; противопоказаны флумазенил, физостигмин и антиаритмики Ia/Ic (новокаинамид).'],

<script>
// Каталог кейсов: разделы по дисциплинам, звёзды за лучший результат, запуск конкретного кейса.
// Названия — по поводу к вызову, без диагноза: диагноз открывается после первого прохождения.
const DISC=[
 ['cardio','Кардиология',['stemi_inf','ape','afib','svt','avblock','tdp','tamponade','htn','dissect','vasovagal','vf']],
 ['pulm','Пульмонология',['asthma','pe','pneumo']],
 ['neuro','Неврология',['stroke','status','pnes','tgh','backsim']],
 ['endo','Эндокринология',['hypo','dka']],
 ['inf','Инфекции и сепсис',['sepsis','mening']],
 ['allergy','Аллергология',['anaph']],
 ['tox','Токсикология',['opioid','co','fos','amanita','tca']],
 ['surg','Хирургия и травма',['gib','trauma','tbi','burns']],
 ['obst','Акушерство и гинекология',['eclampsia','birth','pregarrest','ectopic']],
 ['peds','Педиатрия',['croup','febseiz']],
 ['nephro','Нефрология',['hyperk']],
 ['psych','Психиатрия и наркология',['delirium','panic']],
 ['env','Внешние факторы',['hypo_t','drown']],
];
const CASE_TITLE={
 stemi_inf:'Давит за грудиной',hypo:'Не отвечает, вся в поту',opioid:'Не просыпается у приятеля',stroke:'Перекосило лицо за завтраком',
 ape:'Задыхается ночью, не может лечь',anaph:'Плохо сразу после укола',asthma:'Не может выдохнуть',htn:'Давление 200, тяжёлая голова',
 dka:'Студент: жажда, рвота, худеет',gib:'Слабость и чёрный стул',pe:'Одышка после операции на колене',sepsis:'Кашель, жар, заговаривается',
 vf:'Внезапно потерял сознание в палате',eclampsia:'Беременная: голова раскалывается',tamponade:'Онкопациент: одышка от пары шагов',
 pneumo:'Упал с велосипеда, не может вдохнуть',hyperk:'Пациент на диализе: ноги не держат',avblock:'Падает, в глазах темнеет',
 status:'Судороги у кассы',trauma:'ДТП на трассе',delirium:'Пауки на стенах',tbi:'После драки: «ничего не болит»',
 mening:'Студентка: жар и пятна на ногах',afib:'Сердце выпрыгивает после праздника',croup:'Ребёнок: лающий кашель ночью',
 febseiz:'Ребёнок: судороги на фоне жара',birth:'Роды дома',co:'Плохо в гараже',fos:'Плохо после опрыскивания сада',
 amanita:'Рвота и понос после грибов',burns:'Горела баня',hypo_t:'Нашли на остановке зимой',tdp:'Обмороки на фоне антибиотика',
 pregarrest:'Беременная: внезапная одышка',tca:'Сонная, пустой блистер',drown:'Нырнул и не вынырнул',
 tgh:'«Голова раскалывается — 12 из 10»',panic:'Задыхается на совещании',backsim:'Пятница, 17:30: «сорвал спину»',vasovagal:'Потеряла сознание в процедурном',
 pnes:'«Эпистатус», реланиум не помогает',svt:'Сердце колотится уже час',dissect:'«Разорвало в груди», отдаёт в спину',ectopic:'Упала в ванной, болит живот',
};
// Звёзды по лучшему результату: ≥85% — 3, ≥65% — 2, ≥40% — 1
function starsOf(pct){ return pct>=85?3:pct>=65?2:pct>=40?1:0; }
function starsHTML(n,played){ return `<span class="stars${played?'':' none'}" aria-label="${played?n+' из 3 звёзд':'не пройден'}">${[0,1,2].map(i=>`<i class="${i<n?'on':''}">★</i>`).join('')}</span>`; }
function discOf(id){ const d=DISC.find(x=>x[2].includes(id)); return d?d[1]:'Другое'; }

const DISC_HUE={cardio:'#e5534b',pulm:'#5fd3f0',neuro:'#a98bff',endo:'#f2d24b',inf:'#7bd88f',allergy:'#ff9e6b',tox:'#c6e05a',surg:'#e8a33a',obst:'#ff8ac2',peds:'#6bc5ff',nephro:'#4fd1c5',psych:'#b9a7ff',env:'#8fb8ff',other:'#87a39b'};
function catGroups(){
 const known=new Set(CASES.filter(c=>!c.tutorial).map(c=>c.id));
 const listed=new Set(DISC.flatMap(d=>d[2])), extra=[...known].filter(id=>!listed.has(id));
 return DISC.concat(extra.length?[['other','Другое',extra]]:[]).map(([k,n,ids])=>[k,n,ids.filter(id=>known.has(id))]).filter(g=>g[2].length);
}
function caseCard(id){
 const P=Store.prog, c=CASES.find(x=>x.id===id), pc=P.cases[id], st=pc?starsOf(pc.best):0;
 return `<button class="ccard${pc?' played':''}" data-case="${id}"><span class="ct">${esc(CASE_TITLE[id]||'Вызов')}</span>${pc?`<span class="cdx">${esc(c.dxShort||c.dx)}</span>`:'<span class="cdx muted">Ещё не пройден — диагноз откроется после смены</span>'}
  <span class="cmeta">${starsHTML(st,!!pc)}<span class="muted">${c.loc.map(l=>LOCS[l].n).join(' · ')}${pc?' · лучший '+pc.best+'%':''}</span></span></button>`;
}
// Раздел «Дисциплины»: плитки-папки → внутри кейсы этой дисциплины
function renderCases(mp){
 const P=Store.prog, groups=catGroups(), all=groups.flatMap(g=>g[2]);
 const sum=ids=>ids.reduce((a,id)=>a+(P.cases[id]?starsOf(P.cases[id].best):0),0);
 const g=UI.disc&&groups.find(x=>x[0]===UI.disc);
 if(!g){ UI.disc=null;
  mp.innerHTML=`<div class="cat-head"><div><b>${sum(all)}</b> из ${all.length*3} ★</div><div class="muted">${all.length} кейсов в ${groups.length} дисциплинах. Звёзды — за лучший результат: 85%+ ★★★, 65%+ ★★, 40%+ ★.</div></div>
  <div class="folders">${groups.map(([k,n,ids])=>{ const done=ids.filter(id=>P.cases[id]).length, st=sum(ids);
   return `<button class="folder" data-disc="${k}" style="--hue:${DISC_HUE[k]||'#87a39b'}"><span class="fname">${esc(n)}</span><span class="fmeta"><span>${ids.length} ${plural(ids.length,'кейс','кейса','кейсов')}</span><span class="fst">${st}/${ids.length*3} ★</span></span><span class="fbar"><i style="width:${Math.round(done/ids.length*100)}%"></i></span><span class="fdone muted">${done?`пройдено ${done} из ${ids.length}`:'ещё не начато'}</span></button>`; }).join('')}</div>`;
 } else {
  const [k,n,ids]=g;
  mp.innerHTML=`<div class="fhead" style="--hue:${DISC_HUE[k]||'#87a39b'}"><button class="btn" data-back="1">← Все дисциплины</button><h2>${esc(n)}</h2><span class="fst">${sum(ids)}/${ids.length*3} ★</span></div>
   <div class="clist">${ids.map(caseCard).join('')}</div><p class="muted" style="font-size:12px">Сложность — как выбрано во вкладке «Смена». После прохождения в разборе — правильный алгоритм и сравнение рекомендаций Минздрава РФ и зарубежных обществ.</p>`;
 }
 mp.onclick=e=>{
  if(e.target.closest('[data-back]')){ UI.disc=null; renderCases(mp); window.scrollTo({top:0}); return; }
  const dk=e.target.closest('[data-disc]'); if(dk){ UI.disc=dk.dataset.disc; renderCases(mp); window.scrollTo({top:0}); return; }
  const cb=e.target.closest('[data-case]'); if(!cb) return; const c=CASES.find(x=>x.id===cb.dataset.case);
  if(c.loc.length===1){ start(c.loc[0],c.id); return; }
  openModal(`<div class="kind">${esc(discOf(c.id))}</div><h2>${esc(CASE_TITLE[c.id]||'Вызов')}</h2><p class="muted" style="margin:0">Где принимаете пациента?</p>
   <div class="opts">${c.loc.map(l=>`<button data-sloc="${l}"><b>${LOCS[l].n}</b><span class="muted" style="display:block;font-size:12px">${LOCS[l].tag}</span></button>`).join('')}</div><button class="btn" data-sloc="x">Отмена</button>`,'sheet',false);
  $('modal').onclick=ev=>{ const b=ev.target.closest('[data-sloc]'); if(!b) return; $('modal').onclick=null; closeModal(); if(b.dataset.sloc!=='x') start(b.dataset.sloc,c.id); };
 };
}

<script>
// Интерфейс v2, часть 1: экраны, вкладки, монитор, сцена.
const $=id=>document.getElementById(id);
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function linkify(raw){
 raw=String(raw); const hits=[];
 GLOSS.forEach((g,i)=>{ const re=new RegExp(g[0].source,g[0].flags.replace('g','')+'g'); let m; while((m=re.exec(raw))){ if(!m[0].length){ re.lastIndex++; continue; } hits.push({s:m.index,e:m.index+m[0].length,i}); } });
 hits.sort((a,b)=>a.s-b.s||b.e-a.e); let out='',pos=0;
 for(const h of hits){ if(h.s<pos) continue; out+=esc(raw.slice(pos,h.s))+`<button class="term" data-g="${h.i}">${esc(raw.slice(h.s,h.e))}</button>`; pos=h.e; }
 return out+esc(raw.slice(pos));
}

 ${TGA.inTg&&Store.ready?`<div class="card tgfail"><h3>Не получилось войти через Telegram</h3><p class="muted" style="margin:0">Откройте игру кнопкой «Играть» в боте. Можно сыграть как гость или войти ниже.</p></div>`:''}

 $('f-login').onsubmit=async e=>{ e.preventDefault(); $('l-err').textContent='…'; const er=await Store.login($('l-name').value,$('l-pin').value); $('l-err').textContent=er||''; };

 const tw=$('tgw'); if(tw){ window.TGLogin=async u=>{ $('tg-err').textContent='…'; const er=await Store.tgWidget(u); $('tg-err').textContent=er||''; };
  const sc=document.createElement('script'); sc.async=true; sc.src='https://telegram.org/js/telegram-widget.js?22';

 show('auth');
}

// ── ЭКГ + плетизмограмма
const ecg=$('ecg'), ex=ecg.getContext('2d');
let sweep=0,lastT=performance.now(),beatAt=0,rrSec=0.8,prevY=null,prevP=null,clock=0;
const gauss=(x,m,w,a)=>a*Math.exp(-((x-m)**2)/(2*w*w));
function ecgSample(ph,rh){
 if(rh==='asys') return Math.sin(clock*7)*0.01;
 if(rh==='vf') return 0.45*Math.sin(clock*31)+0.3*Math.sin(clock*19+1)+0.2*Math.sin(clock*47+2);
 if(rh==='vt'||rh==='pvt') return 0.9*Math.sin(clock*2*Math.PI*3)-0.2*Math.sin(clock*12);
 if(rh==='tdp') return Math.sin(clock*2*Math.PI*4)*(0.2+0.9*Math.abs(Math.sin(clock*1.3)));
 if(rh==='fvf') return 0.12*Math.sin(clock*29)+0.08*Math.sin(clock*41+1)+0.05*Math.sin(clock*17+2);
 if(rh==='pasys') return gauss((clock*1.17)%1,0.5,0.03,0.15)+Math.sin(clock*7)*0.01;
 let y=0; const wide=rh==='peaw'?3:(rh==='pea'||rh==='chb'||rh==='peakT')?1.9:1;
 if(rh==='chb'){ const pp=(clock*1.3)%1; y+=gauss(pp,0.5,0.025,0.13); }
 else if(rh==='afib') y+=0.04*Math.sin(clock*40)+0.03*Math.sin(clock*55);
 else if(rh!=='peakT'&&rh!=='svt') y+=gauss(ph,0.08,0.025,0.12);
 y+=gauss(ph,0.2,0.008*wide,-0.12)+gauss(ph,0.22,0.011*wide,1.0)+gauss(ph,0.245,0.01*wide,-0.25);
 if(rh==='stemi') y+=(ph>0.25&&ph<0.42?0.22:0)+gauss(ph,0.42,0.06,0.25);
 else if(rh==='peakT') y+=gauss(ph,0.4,0.03,0.75);
 else y+=gauss(ph,0.45,0.05,0.25);
 return y;
}

 requestAnimationFrame(frame);
}
function drawECG(s,dt){
